<!DOCTYPE html>
<html lang="es-CO" data-theme="gray">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Proyectos · Numination</title>
<meta name="supabase-publishable-key" content="sb_publishable_mrKTw0QGiuikjTb6SY0Hgg_Nak0QLk7" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/themes.css" />
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text-primary)}.bar{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center}a{color:inherit;text-decoration:none}.body{max-width:640px;margin:0 auto;padding:16px}.item{display:block;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--surface);margin-bottom:8px}button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer}</style>
</head>
<body>
<header class="bar"><a href="/chat">←</a><strong style="flex:1">Proyectos</strong><button type="button" id="new">Nuevo</button></header>
<main class="body" id="list">Cargando…</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
(async function(){
  try{var t=localStorage.getItem('numination-theme');if(t)document.documentElement.dataset.theme=t;}catch(_){}
  function withTimeout(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null);},ms);})]);}
  var session=null;
  try{session=await withTimeout(NuminationAuth.getSession(),5000);}catch(_){session=null;}
  if(!session){location.replace('/login');return;}
  async function load(){
    try{
      var d=await NuminationApi.listProjects();
      var list=Array.isArray(d)?d:(d.projects||[]);
      document.getElementById('list').innerHTML=list.length?list.map(function(p){return '<a class="item" href="/coder?projectId='+encodeURIComponent(p.id)+'"><strong>'+(p.name||'Proyecto')+'</strong><div style="color:var(--text-secondary);font-size:13px">'+(p.description||p.id)+'</div></a>';}).join(''):'Sin proyectos todavía. Toca Nuevo.';
    }catch(e){document.getElementById('list').textContent=(e&&e.message)||'Error cargando proyectos';}
  }
  document.getElementById('new').onclick=async function(){
    var name=prompt('Nombre del proyecto');
    if(!name)return;
    try{await NuminationApi.createProject({name:name.trim()});load();}catch(e){alert((e&&e.message)||'Error');}
  };
  load();
})();
</script>
</body>
</html>
