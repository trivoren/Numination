<!DOCTYPE html>
<html lang="es-CO" data-theme="gray">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ajustes · Numination</title>
<meta name="supabase-publishable-key" content="sb_publishable_mrKTw0QGiuikjTb6SY0Hgg_Nak0QLk7" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/themes.css" />
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text-primary)}.bar{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}a{color:inherit;text-decoration:none}.body{max-width:640px;margin:0 auto;padding:16px}.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}.theme{display:grid;grid-template-columns:1fr 1fr;gap:10px}button.t{padding:14px;border-radius:14px;border:2px solid var(--border);background:var(--surface);cursor:pointer;text-align:left}button.t.on{border-color:var(--accent)}.link{display:block;padding:12px 0;border-bottom:1px solid var(--border)}</style>
</head>
<body>
<header class="bar"><a href="/chat">←</a><strong>Ajustes</strong></header>
<main class="body">
  <div class="card"><h3>Tema</h3><div class="theme" id="themes"></div></div>
  <div class="card">
    <a class="link" href="/theme">Tema completo</a>
    <a class="link" href="/profile">Perfil</a>
    <a class="link" href="/credits">Créditos</a>
    <a class="link" href="/plans">Planes</a>
    <a class="link" href="/connectors">Conectores</a>
    <a class="link" href="/custom-strings">Personalización</a>
    <a class="link" href="/uploaded-files">Archivos subidos</a>
    <a class="link" href="/privacy">Privacidad</a>
    <a class="link" href="/terminos">Términos</a>
  </div>
  <button id="logout" style="width:100%;height:48px;border:none;border-radius:14px;background:var(--text-primary);color:var(--bg);font-weight:700;cursor:pointer">Cerrar sesión</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
const themes=['gray','light','dark','midnight'];const labels={gray:'Gris',light:'Blanco',dark:'Oscuro',midnight:'Medianoche'};
let cur='gray';try{cur=localStorage.getItem('numination-theme')||'gray';}catch(_){}
document.documentElement.dataset.theme=cur;
const g=document.getElementById('themes');
themes.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='t'+(t===cur?' on':'');b.textContent=labels[t];b.onclick=()=>{cur=t;localStorage.setItem('numination-theme',t);document.documentElement.dataset.theme=t;g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');};g.appendChild(b);});
document.getElementById('logout').onclick=async()=>{await NuminationAuth.signOut();location.replace('/login');};
</script>
</body>
</html>
