<!DOCTYPE html>
<html lang="es-CO" data-theme="gray">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Créditos · Numination</title>
<meta name="supabase-publishable-key" content="sb_publishable_mrKTw0QGiuikjTb6SY0Hgg_Nak0QLk7" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/themes.css" />
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text-primary)}.bar{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center}a{color:inherit;text-decoration:none}.body{max-width:640px;margin:0 auto;padding:16px}.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}.bal{font-size:36px;font-weight:800}</style>
</head>
<body>
<header class="bar"><a href="/chat">←</a><strong>Créditos</strong><a href="/plans" style="margin-left:auto">Planes</a></header>
<main class="body">
  <div class="card"><div class="muted">Saldo</div><div class="bal" id="bal">—</div></div>
  <div class="card" id="hist">Cargando historial…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
(async function(){
  try{const t=localStorage.getItem('numination-theme');if(t)document.documentElement.dataset.theme=t;}catch(_){}
  if(!(await NuminationAuth.getSession())){location.replace('/login');return;}
  try{const c=await NuminationApi.credits();document.getElementById('bal').textContent=String(c.balance??0);}catch(e){document.getElementById('bal').textContent='?';}
  try{
    const h=await NuminationApi.creditsHistory();
    const list=h.history||h.items||(Array.isArray(h)?h:[]);
    document.getElementById('hist').innerHTML=list.length?list.slice(0,40).map(r=>'<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>'+(r.reason||r.type||'Movimiento')+'</span><strong>'+(r.amount??'')+'</strong></div>').join(''):'Sin movimientos';
  }catch(e){document.getElementById('hist').textContent=e.message||'Error';}
})();
</script>
</body>
</html>
