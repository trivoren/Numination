<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Numination · Modo Coder</title>
  <meta name="description" content="IDE basado en web con asistente de IA integrado." />
  <link rel="icon" href="favicon.ico" />

  <!-- Tipografías del sistema de diseño (Sora UI / JetBrains Mono código) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="assets/css/coder.css" />

  <!-- ════════════════════════════════════════════════════════════════════
       FIX PRODUCCIÓN · CSP style-src no permite cdn.jsdelivr.net, así que
       el <link> externo de xterm era bloqueado y la terminal quedaba sin
       estilos (sin output visible, sin foco usable). Se embebe el CSS de
       @xterm/xterm@5.5.0 verbatim (style-src 'unsafe-inline' sí lo permite).
       ════════════════════════════════════════════════════════════════════ -->
  <style>
    /* xterm.min.css · @xterm/xterm@5.5.0 (vendored inline) */
    .xterm{cursor:text;position:relative;user-select:none;-ms-user-select:none;-webkit-user-select:none}.xterm.focus,.xterm:focus{outline:0}.xterm .xterm-helpers{position:absolute;top:0;z-index:5}.xterm .xterm-helper-textarea{padding:0;border:0;margin:0;position:absolute;opacity:0;left:-9999em;top:0;width:0;height:0;z-index:-5;white-space:nowrap;overflow:hidden;resize:none}.xterm .composition-view{background:#000;color:#fff;display:none;position:absolute;white-space:nowrap;z-index:1}.xterm .composition-view.active{display:block}.xterm .xterm-viewport{background-color:#000;overflow-y:scroll;cursor:default;position:absolute;right:0;left:0;top:0;bottom:0}.xterm .xterm-screen{position:relative}.xterm .xterm-screen canvas{position:absolute;left:0;top:0}.xterm .xterm-scroll-area{visibility:hidden}.xterm-char-measure-element{display:inline-block;visibility:hidden;position:absolute;top:0;left:-9999em;line-height:normal}.xterm.enable-mouse-events{cursor:default}.xterm .xterm-cursor-pointer,.xterm.xterm-cursor-pointer{cursor:pointer}.xterm.column-select.focus{cursor:crosshair}.xterm .xterm-accessibility:not(.debug),.xterm .xterm-message{position:absolute;left:0;top:0;bottom:0;right:0;z-index:10;color:transparent;pointer-events:none}.xterm .xterm-accessibility-tree:not(.debug) ::selection{color:transparent}.xterm .xterm-accessibility-tree{user-select:text;white-space:pre}.xterm .live-region{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.xterm-dim{opacity:1!important}.xterm-underline-1{text-decoration:underline}.xterm-underline-2{text-decoration:double underline}.xterm-underline-3{text-decoration:wavy underline}.xterm-underline-4{text-decoration:dotted underline}.xterm-underline-5{text-decoration:dashed underline}.xterm-overline{text-decoration:overline}.xterm-overline.xterm-underline-1{text-decoration:overline underline}.xterm-overline.xterm-underline-2{text-decoration:overline double underline}.xterm-overline.xterm-underline-3{text-decoration:overline wavy underline}.xterm-overline.xterm-underline-4{text-decoration:overline dotted underline}.xterm-overline.xterm-underline-5{text-decoration:overline dashed underline}.xterm-strikethrough{text-decoration:line-through}.xterm-screen .xterm-decoration-container .xterm-decoration{z-index:6;position:absolute}.xterm-screen .xterm-decoration-container .xterm-decoration.xterm-decoration-top-layer{z-index:7}.xterm-decoration-overview-ruler{z-index:8;position:absolute;top:0;right:0;pointer-events:none}.xterm-decoration-top{z-index:2;position:relative}
  </style>

  <!-- ════════════════════════════════════════════════════════════════════
       CAPA PREMIUM · refina coder.css sin tocar el sistema base.
       Restrictiva a propósito: sólo detalle visual y estados nuevos.
       ════════════════════════════════════════════════════════════════════ -->
  <style id="nm-coder-premium">
    /* ── Ambiente: profundidad sutil sobre el "montaje negro" ── */
    body {
      background:
        radial-gradient(1100px 500px at 8% -10%, rgba(139, 92, 246, 0.06), transparent 60%),
        radial-gradient(900px 420px at 100% 0%, rgba(139, 92, 246, 0.045), transparent 55%),
        var(--base);
    }

    /* ── Botones: g Napoleon macizo + halo del acento ── */
    .btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
    .btn--accent {
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.26);
      letter-spacing: 0.01em;
    }
    .btn--accent:hover { box-shadow: 0 8px 24px rgba(139, 92, 246, 0.34); }

    /* ── Botón GUARDAR con icono de disco y estados emocionales ── */
    #btn-save {
      display: inline-flex; align-items: center; gap: 6px;
      transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
                  color var(--dur) var(--ease), transform var(--dur-fast) var(--ease);
    }
    #btn-save svg { flex: none; }
    #btn-save.is-dirty { box-shadow: 0 0 0 1px rgba(139, 92, 246, .45), 0 6px 18px rgba(139, 92, 246, .22); }
    #btn-save.is-saving { opacity: .65; pointer-events: none; }
    #btn-save.is-saving .btn-save__icon { animation: save-spin .9s linear infinite; }
    @keyframes save-spin { to { transform: rotate(360deg); } }
    #btn-save.is-saved {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ecfdf5;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.30);
    }

    /* ── REGIONES con radio y sombra (look IDE real) ── */
    .explorer { z-index: 1; }
    .editor-column {
      background: linear-gradient(180deg, var(--surface) 0%, #101018 100%);
    }
    .editor-surface {
      margin: 10px 12px 8px;
      border-radius: 10px;
      border: 1px solid #1e1e29;
      overflow: clip;              /* confina SIEMPRE al editor */
      box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, var(--shadow-near);
      background: var(--surface);
    }
    .editor-surface:focus-within { border-color: rgba(139, 92, 246, 0.35); }
    .editor-status { border-radius: 0 0 12px 12px; }

    /* ── Skeleton premium mientras Monaco termina de renderizar ── */
    .editor-loading { place-items: center; row-gap: 14px; }
    .editor-skeleton { width: min(560px, 72vw); display: grid; row-gap: 10px; }
    .editor-skeleton span {
      height: 12px; border-radius: 5px;
      background: linear-gradient(90deg, #1b1b26 25%, #23232f 42%, #1b1b26 60%);
      background-size: 320px 100%;
      animation: sk-shimmer 1.25s infinite linear;
    }
    .editor-skeleton span:nth-child(1) { width: 34%; height: 14px; }
    .editor-skeleton span:nth-child(2) { width: 88%; }
    .editor-skeleton span:nth-child(4) { width: 74%; margin-inline: 24px; }
    .editor-skeleton span:nth-child(5) { width: 92%; }
    .editor-skeleton span:nth-child(6) { width: 45%; }
    @keyframes sk-shimmer {
      0% { background-position: -320px 0; }
      100% { background-position: 320px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .editor-skeleton span { animation: none; }
      .nm-dot.is-running { animation: none; }
    }

    /* ── Pestañas Chat/Terminal con jerarquía y estado vivo ── */
    .assistant-tabs { position: relative; background: var(--base); }
    .assistant-tabs__tab {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 0 var(--space-s);
      position: relative;
    }
    .assistant-tabs__tab:focus-visible { outline: 2px solid var(--accent-2); outline-offset: -3px; }
    .assistant-tabs__tab.is-active {
      color: #f4ecff;
      box-shadow: inset 0 -2px 0 var(--accent);
      text-shadow: 0 0 14px rgba(139, 92, 246, 0.55);
    }
    .assistant-tabs__tab .assistant-tabs__icon { font-size: 13px; opacity: .92; }

    /* Estado de la terminal: punto vivo en la pestaña */
    .assistant-tabs__dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #3a3a4c; flex: none;
      transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    #tab-terminal .assistant-tabs__dot.is-ready { background: var(--accent-2); box-shadow: 0 0 8px var(--accent); }
    #tab-terminal .assistant-tabs__dot.is-running { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    #tab-terminal .assistant-tabs__dot.is-error { background: var(--err); box-shadow: 0 0 8px var(--err); }

    /* ── Barra de la terminal (título + controles) ── */
    #panel-terminal { display: flex; flex-direction: column; }
    .terminal-toolbar {
      flex: none;
      display: flex; align-items: center; gap: 8px;
      padding: 5px 10px;
      border-bottom: var(--border);
      background: var(--base);
      font-family: var(--font-code);
      font-size: var(--step--2);
      color: var(--ink-3);
    }
    .terminal-toolbar__title { color: var(--ink-2); }
    .terminal-toolbar__hint { margin-left: auto; }
    .terminal-toolbar .btn { padding: 2px 8px; border-radius: 5px; }
    .nm-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #3a3a4c; flex: none;
    }
    .nm-dot.is-ready { background: var(--accent-2); box-shadow: 0 0 8px var(--accent); }
    .nm-dot.is-running { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: dm-pulse 1.1s ease-in-out infinite; }
    .nm-dot.is-error { background: var(--err); box-shadow: 0 0 8px var(--err); }
    @keyframes dm-pulse { 50% { opacity: .45; } }

    /* ── Compositor del chat con glow de foco ── */
    .chat-composer__input:focus {
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.20);
      border-radius: var(--radius);
    }
    .chat-composer__input::placeholder { color: var(--ink-3); }

    /* ── Pill de estado del backend de archivos ── */
    .explorer-conn {
      display: flex; align-items: center; gap: 6px;
      margin-top: 6px;
      font-family: var(--font-code);
      font-size: var(--step--2);
      color: var(--ink-3);
    }
    .explorer-conn__dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #3a3a4c; flex: none;
      transition: background var(--dur) var(--ease);
    }
    .explorer-conn[data-state="ok"]   .explorer-conn__dot { background: var(--ok); box-shadow: 0 0 7px var(--ok); }
    .explorer-conn[data-state="err"]  .explorer-conn__dot { background: var(--err); box-shadow: 0 0 7px var(--err); }
    .explorer-conn[data-state="busy"] .explorer-conn__dot { background: var(--accent-2); animation: dm-pulse 1s ease-in-out infinite; }

    /* ── Terminales flotantes del sistema, radio coherente ── */
    .modal__card { border-radius: 12px; }
    .btn--ghost { border-color: transparent; }
  </style>

  <!-- Monaco AMD loader: anclado a CDN para que Vercel no empaquete megas inútiles -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script>
    /* Configuración del loader de Monaco en hosting cross-origin.
       Vercel sirve la página pero el bundle de Monaco vive en el CDN,
       así que el worker se proxya vía Blob para ejecutar en misma origen. */
    if (typeof require !== 'undefined') {
      require.config({
        paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }
      });
      window.MonacoEnvironment = {
        getWorkerUrl: function () {
          var proxy = 'self.MonacoEnvironment={baseUrl:"https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/"};' +
            'importScripts("https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/base/worker/workerMain.js");';
          return URL.createObjectURL(new Blob([proxy], { type: 'text/javascript' }));
        }
      };
    }
  </script>
</head>
<body>
  <main class="coder-app" id="coder-app" aria-label="Entorno de desarrollo Numination">

    <!-- ══════════ COLUMNA 1: EXPLORADOR DE ARCHIVOS ══════════ -->
    <aside class="explorer" aria-label="Explorador de archivos" id="explorer">
      <header class="explorer__header">
        <span class="explorer__brand" aria-hidden="true"></span>
        <h1 class="explorer__title">Numination</h1>
        <span class="explorer__mode">Coder</span>
      </header>
      <div class="explorer__actions">
        <button type="button" class="btn btn--ghost btn--sm" id="btn-refresh-tree" aria-label="Recargar árbol de archivos">
          Recargar
        </button>
        <div class="explorer-conn" id="explorer-conn" data-state="busy" role="status" aria-live="polite">
          <span class="explorer-conn__dot" aria-hidden="true"></span>
          <span class="explorer-conn__label" id="explorer-conn-label">Conectando…</span>
        </div>
      </div>
      <nav id="file-tree" class="file-tree" role="tree" aria-label="Proyecto" aria-busy="true">
        <!-- file-tree.js renderiza aquí -->
      </nav>
      <footer class="explorer__footer">
        <div class="explorer__user" id="explorer-user" title="Sesión activa">
          <span class="explorer__avatar" aria-hidden="true">N</span>
          <span class="explorer__username">Cargando sesión…</span>
        </div>
      </footer>
    </aside>

    <!-- ══════════ COLUMNA 2: EDITOR (MONACO) ══════════ -->
    <section class="editor-column" aria-label="Editor de código">
      <header class="editor-bar">
        <div class="editor-bar__tabs" id="editor-tabs" role="tablist" aria-label="Archivos abiertos"></div>
        <div class="editor-bar__actions">
          <button type="button" class="btn btn--accent btn--sm" id="btn-save" aria-label="Guardar archivo actual (Ctrl+S)">
            <svg class="btn-save__icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            <span id="btn-save-label">Guardar</span>
          </button>
        </div>
      </header>
      <div class="editor-surface">
        <div id="monaco-container" class="monaco-container" role="code" aria-label="Área de código"></div>
        <div class="editor-loading" id="editor-loading" aria-live="polite">
          <div class="editor-skeleton" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <span class="editor-loading__text" style="font-size:var(--step--2);letter-spacing:.06em;">
            Preparando el entorno de edición…
          </span>
        </div>
      </div>
      <footer class="editor-status" id="editor-status">
        <span id="status-file">—</span>
        <span id="status-dirty"></span>
        <span id="status-file-extra" aria-hidden="true"></span>
        <span class="editor-status__spacer" aria-hidden="true"></span>
        <span id="status-language">plaintext</span>
      </footer>
    </section>

    <!-- ══════════ COLUMNA 3: CHAT IA + TERMINAL (pestañas) ══════════ -->
    <section class="assistant-column" id="assistant-column" aria-label="Asistente y terminal">
      <header class="assistant-tabs" role="tablist" aria-label="Paneles">
        <button type="button" class="assistant-tabs__tab is-active" id="tab-chat" role="tab" aria-selected="true" aria-controls="panel-chat" tabindex="0">
          <span class="assistant-tabs__icon" aria-hidden="true">💬</span>
          Chat IA
        </button>
        <button type="button" class="assistant-tabs__tab" id="tab-terminal" role="tab" aria-selected="false" aria-controls="panel-terminal" tabindex="-1">
          <span class="assistant-tabs__icon" aria-hidden="true">⌨</span>
          Terminal
          <span class="assistant-tabs__dot" id="tab-terminal-dot" aria-hidden="true"></span>
        </button>
      </header>

      <div class="assistant-panel" id="panel-chat" role="tabpanel" aria-labelledby="tab-chat">
        <div class="chat-stream" id="chat-stream" aria-live="polite" aria-label="Conversación con la IA">
          <!-- agent-chat.js renderiza aquí -->
        </div>
        <form class="chat-composer" id="chat-form" autocomplete="off">
          <textarea id="chat-input" class="chat-composer__input" rows="3"
            placeholder="Pide un cambio: “añade validación al formulario”… (Enter envía · Shift+Enter salto)"
            aria-label="Mensaje para la IA"></textarea>
          <button type="submit" class="btn btn--accent" id="btn-send" aria-label="Enviar mensaje a la IA">
            Enviar
          </button>
        </form>
      </div>

      <div class="assistant-panel" id="panel-terminal" role="tabpanel" aria-labelledby="tab-terminal" hidden>
        <div class="terminal-toolbar">
          <span class="nm-dot" id="terminal-dot" aria-hidden="true"></span>
          <span class="terminal-toolbar__title" id="terminal-title">Terminal · sandbox simulado</span>
          <span class="terminal-toolbar__hint">↑/↓ historial · Ctrl+L limpiar</span>
          <button type="button" class="btn btn--ghost" id="btn-terminal-clear" aria-label="Limpiar terminal">Limpiar</button>
        </div>
        <div id="terminal-mount" class="terminal-mount" aria-label="Terminal"></div>
      </div>
    </section>
  </main>

  <!-- ══════════ MODAL: DIFF VIEWER ══════════ -->
  <div class="modal" id="diff-modal" role="dialog" aria-modal="true" aria-labelledby="diff-modal-title" hidden>
    <div class="modal__backdrop" data-diff-close></div>
    <div class="modal__card" role="document">
      <header class="modal__header">
        <h2 class="modal__title" id="diff-modal-title">Cambios propuestos por la IA</h2>
        <div class="diff-stats" id="diff-stats">
          <span class="diff-stats__add" id="diff-stat-add">+0</span>
          <span class="diff-stats__del" id="diff-stat-del">−0</span>
        </div>
        <button type="button" class="btn btn--ghost btn--sm" data-diff-close aria-label="Cerrar revisión de cambios">✕</button>
      </header>
      <div class="modal__body" id="diff-body">
        <!-- diff-viewer.js inyecta las columnas antes/después -->
      </div>
      <footer class="modal__footer">
        <button type="button" class="btn btn--ghost" data-diff-action="discard">Descartar</button>
        <button type="button" class="btn btn--accent" data-diff-action="apply">Aplicar cambios</button>
      </footer>
    </div>
  </div>

  <!-- ══════════ TOASTS ══════════ -->
  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite" aria-relevant="additions text"></div>

  <!-- ══════════ NÚCLEO: bus de eventos, toasts, cliente HTTP ══════════ -->
  <!-- ide-events.js debe ir PRIMERO: numination-boot.js sólo crea su bus de
       respaldo si window.eventBus aún no existe. -->
  <script src="assets/js/ide-events.js"></script>
  <script src="assets/js/numination-boot.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>

  <!-- ══════════ EDITOR, ÁRBOL, DIFF, CHAT Y TERMINAL ══════════ -->
  <script src="assets/js/editor-core.js"></script>
  <script src="assets/js/file-tree.js"></script>
  <script src="assets/js/diff-viewer.js"></script>
  <script src="assets/js/agent-chat.js"></script>
  <script src="assets/js/terminal.js"></script>

  <!-- ══════════ SUPER-EDITOR · Fase 2 ══════════
       autocomplete IA · búsqueda de archivos (Ctrl+P) · búsqueda global
       (Ctrl+Shift+F) · formateo (Shift+Alt+F) · buscar/reemplazar (Ctrl+H)
       · drag & drop · vista previa en vivo · terminal con historial
       · sound effects · skeletons · offline · instalador PWA -->
  <script src="assets/js/loading-skeletons.js"></script>
  <script src="assets/js/toast-manager.js"></script>
  <script src="assets/js/sound-effects.js"></script>
  <script src="assets/js/terminal-history.js"></script>
  <script src="assets/js/code-explainer.js"></script>
  <script src="assets/js/code-autocomplete.js"></script>
  <script src="assets/js/file-search.js"></script>
  <script src="assets/js/code-search.js"></script>
  <script src="assets/js/drag-drop-files.js"></script>
  <script src="assets/js/format-code.js"></script>
  <script src="assets/js/find-and-replace.js"></script>
  <script src="assets/js/live-preview.js"></script>
  <script src="assets/js/offline-mode.js"></script>
  <script src="assets/js/pwa-installer.js"></script>

  <!-- ══════════ CONTROLADOR DE SHELL: pestañas, guardado, enfoques ══════════ -->
  <script>
    (function () {
      'use strict';

      /* ══ 1 · PESTAÑAS Chat IA / Terminal con semántica ARIA completa ══
         Al pasar a "Terminal" se activa (inicia Enfoca) la terminal real;
         al pasar de vuelta a "Chat IA" el foco vuelve al compositor.
         Se emite `assistant:tab` por el bus para desacoplar módulos.     */
      var TABS = [
        { btn: document.getElementById('tab-chat'),       panel: document.getElementById('panel-chat'),       id: 'chat' },
        { btn: document.getElementById('tab-terminal'),   panel: document.getElementById('panel-terminal'),   id: 'terminal' }
      ];

      function select(active, opts) {
        var focusTerminal = false;
        TABS.forEach(function (t) {
          var isActive = t === active;
          t.btn.classList.toggle('is-active', isActive);
          t.btn.setAttribute('aria-selected', String(isActive));
          t.btn.tabIndex = isActive ? 0 : -1;
          t.panel.hidden = !isActive;
          if (isActive && t.id === 'terminal') focusTerminal = true;
        });
        if (window.eventBus) window.eventBus.emit('assistant:tab', { id: active.id });
        if (focusTerminal && window.NuminTerminal) {
          window.NuminTerminal.activate(); // init si hace falta + fit + focus
        } else if (active.id === 'chat') {
          var input = document.getElementById('chat-input');
          if (input && !input.disabled && matchMedia('(min-width: 1024px)').matches) input.focus();
        }
        if (opts && opts.focusBtn && active.btn) active.btn.focus();
      }

      TABS.forEach(function (t) {
        t.btn.addEventListener('click', function () { select(t); });
      });

      /* Navegación con teclado: ←/→ mueven el foco entre pestañas. */
      var tablist = document.querySelector('.assistant-tabs');
      tablist && tablist.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' && e.key !== 'Home' && e.key !== 'End') return;
        e.preventDefault();
        var order = TABS;
        var i = order.findIndex(function (t) { return t.btn.getAttribute('aria-selected') === 'true'; });
        var next = i;
        if (e.key === 'ArrowLeft') next = (i - 1 + order.length) % order.length;
        else if (e.key === 'ArrowRight') next = (i + 1) % order.length;
        else if (e.key === 'Home') next = 0;
        else next = order.length - 1;
        select(order[next], { focusBtn: true });
      });

      /* Modo hash: /coder.html#terminal aterriza como pestaña terminal. */
      if (window.location.hash === '#terminal') {
        requestAnimationFrame(function () { select(TABS[1]); });
      }
      window.addEventListener('hashchange', function () {
        if (window.location.hash === '#terminal') select(TABS[1]);
        else if (window.location.hash === '#chat') select(TABS[0]);
      });

      /* ══ 2 · BOTÓN GUARDAR: icono de disco → spin → check verde ══ */
      var saveBtn = document.getElementById('btn-save');
      var saveLabel = document.getElementById('btn-save-label');
      var saveTimer = null;
      var BASE_LABEL = 'Guardar';

      function setSaveState(state) {
        if (!saveBtn || !saveLabel) return;
        clearTimeout(saveTimer);
        saveBtn.classList.remove('is-saving', 'is-saved', 'is-dirty');
        if (state === 'saving') {
          saveBtn.classList.add('is-saving');
          saveLabel.textContent = 'Guardando…';
        } else if (state === 'saved') {
          saveBtn.classList.add('is-saved');
          saveLabel.textContent = 'Guardado ✓';
          saveTimer = setTimeout(function () {
            saveBtn.classList.remove('is-saved');
            saveLabel.textContent = BASE_LABEL;
          }, 1900);
        } else {
          saveLabel.textContent = BASE_LABEL;
        }
      }

      if (window.eventBus) {
        window.eventBus.on('file:save', function () { setSaveState('saving'); });
        window.eventBus.on('editor:saved', function () { setSaveState('saved'); });
        window.eventBus.on('editor:dirty', function (data) {
          if (data && data.isDirty) saveBtn && saveBtn.classList.add('is-dirty');
          else saveBtn && saveBtn.classList.remove('is-dirty');
        });
        window.eventBus.on('chat:error', function () {
          setSaveState('');                 // desbloquea si el guardado era post-chat
        });
      }

      /* Ctrl+S con el foco FUERA de Monaco (p.ej. escribiendo en el chat).
         Si Monaco ya maneja la tecla, su preventDefault corta el doble envío. */
      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 's') {
          if (e.defaultPrevented) return;
          e.preventDefault();
          setSaveState('saving');
          if (window.eventBus) window.eventBus.emit('file:save', { path: window.EditorState?.getActiveFile?.()?.path });
        }
      });

      /* ══ 3 · LIMPIAR TERMINAL desde su barra ══ */
      var clearBtn = document.getElementById('btn-terminal-clear');
      clearBtn && clearBtn.addEventListener('click', function () {
        if (window.NuminTerminal) window.NuminTerminal.clear();
      });

      /* ══ 4 · Warn antes de perder cambios sin guardar ══ */
      window.addEventListener('beforeunload', function (e) {
        if (window.EditorState && typeof window.EditorState.isDirty === 'function' && window.EditorState.isDirty()) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
    })();
  </script>
</body>
</html>
