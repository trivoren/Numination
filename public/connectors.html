<!DOCTYPE html>
<html lang="es-CO" data-theme="gray">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conectores · Numination</title>
<meta name="supabase-publishable-key" content="sb_publishable_mrKTw0QGiuikjTb6SY0Hgg_Nak0QLk7" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/themes.css" />
<style id="s"></style>
</head>
<body>
<div class="page">
  <header class="page-bar"><a href="/chat">←</a><h1>Conectores</h1></header>
  <main class="page-body" id="list"><p class="muted">Cargando…</p></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
(async function(){
  document.getElementById('s').textContent=NuminationShell.pageStyles();
  NuminationShell.initTheme();
  if(!(await NuminationShell.requireSession()))return;
  try{
    var d=await NuminationApi.integrations();
    var list=d.integrations||d.connectors||d.items||(Array.isArray(d)?d:[]);
    document.getElementById('list').innerHTML=list.length?list.map(function(c){
      var name=c.name||c.id||'Conector';
      var on=c.connected||c.enabled;
      return '<div class="card row"><div><strong>'+name+'</strong><p class="muted">'+(c.description||'')+'</p></div><span class="badge">'+(on?'Activo':'Off')+'</span></div>';
    }).join(''):'<div class="empty">Sin conectores disponibles.</div>';
  }catch(e){document.getElementById('list').innerHTML='<p class="muted">'+(e.message||'Error')+'</p>';}
})();
</script>
</body>
</html>
