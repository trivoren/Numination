<!DOCTYPE html>
<html lang="es-CO" data-theme="gray">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Numination</title>
<meta name="supabase-publishable-key" content="sb_publishable_mrKTw0QGiuikjTb6SY0Hgg_Nak0QLk7" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/themes.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text-primary);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,textarea{font:inherit;color:inherit}button{border:none;background:none;cursor:pointer}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none}.backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);background:var(--surface);border-right:1px solid var(--border);z-index:50;transform:translateX(-105%);transition:transform .22s;padding:14px;overflow:auto}.drawer.open{transform:none}
.drawer a{display:block;padding:12px 10px;border-radius:10px;text-decoration:none;color:inherit;font-size:14.5px}.drawer a:hover{background:var(--surface-alt)}
.chat-item{padding:10px 12px;border-radius:10px;width:100%;text-align:left;margin:2px 0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item:hover,.chat-item.active{background:var(--surface-alt)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px}
.icon{padding:8px;border-radius:50%}.icon:hover{background:var(--surface-alt)}
.search{flex:1;height:42px;border-radius:22px;background:var(--surface);display:flex;align-items:center;padding:0 14px;color:var(--text-secondary);text-decoration:none}
.scroll{flex:1;overflow:auto;display:flex;flex-direction:column}
.empty{margin:auto;text-align:center;padding:24px;color:var(--text-secondary)}
.msgs{padding:8px 12px 18px;display:flex;flex-direction:column;gap:8px}
.user{align-self:flex-end;max-width:88%;padding:12px 16px;border-radius:18px;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.ai{align-self:stretch;line-height:1.6;font-size:15px}
.ai pre{background:#0f0f10;color:#e6e6e6;padding:12px;border-radius:12px;overflow:auto;font-family:JetBrains Mono,monospace;font-size:12px;margin:8px 0}
.bottom{padding:8px 12px 14px}
.composer{display:flex;gap:6px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:6px}
.composer textarea{flex:1;border:none;outline:none;background:transparent;padding:10px;min-height:42px;max-height:120px;resize:none}
.send{width:40px;height:40px;border-radius:50%;background:var(--text-primary);color:var(--bg);font-weight:700}.send:disabled{opacity:.35}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;color:var(--text-secondary)}
.nav-label{font-size:12px;font-weight:700;margin:12px 0 6px;color:var(--text-secondary)}
</style>
</head>
<body>
<div class="gate" id="gate">Cargando…</div>
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <strong id="uname">Usuario</strong>
    <button type="button" id="logout" style="margin-left:auto">Salir</button>
  </div>
  <a href="/projects">Proyectos</a>
  <a href="/coder">Coder</a>
  <a href="/artifacts">Artefactos</a>
  <a href="/ghost">Ghost</a>
  <a href="/memory">Memoria</a>
  <a href="/connectors">Conectores</a>
  <a href="/notifications">Notificaciones</a>
  <a href="/credits">Créditos <span id="bal">—</span></a>
  <a href="/settings">Ajustes</a>
  <a href="/profile">Perfil</a>
  <div class="nav-label">Sesiones</div>
  <button type="button" class="chat-item" id="new-chat" style="font-weight:600">+ Nuevo chat</button>
  <div id="chat-list"></div>
</aside>
<header class="top">
  <button class="icon" id="menu" type="button">☰</button>
  <a class="search" href="/search">Buscar chats</a>
  <a class="icon" href="/ghost" title="Ghost">👻</a>
</header>
<div class="scroll" id="scroll">
  <div class="empty" id="empty">¿En qué trabajamos hoy?</div>
  <div class="msgs" id="msgs" hidden></div>
</div>
<footer class="bottom">
  <div class="composer">
    <textarea id="input" placeholder="¿Qué quieres resolver hoy?"></textarea>
    <button class="send" id="send" disabled>→</button>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
(async function(){
  try{var t=localStorage.getItem('numination-theme');document.documentElement.dataset.theme=t||'gray';}catch(_){}
  function withTimeout(p, ms){
    return Promise.race([p, new Promise(function(resolve){ setTimeout(function(){ resolve(null); }, ms); })]);
  }
  var Auth=window.NuminationAuth, Api=window.NuminationApi;
  if(!Auth||!Api){ location.replace('/login'); return; }
  var session=null;
  try{ session=await withTimeout(Auth.getSession(), 5000); }catch(_){ session=null; }
  if(!session){ location.replace('/login'); return; }
  document.getElementById('gate').hidden=true;
  document.getElementById('uname').textContent=((session.user&&session.user.email)||'Usuario').split('@')[0];

  var state={chats:[],active:null,messages:[],sending:false};
  var msgs=document.getElementById('msgs');
  var empty=document.getElementById('empty');
  var input=document.getElementById('input');
  var send=document.getElementById('send');

  function openDrawer(o){
    document.getElementById('drawer').classList.toggle('open',o);
    document.getElementById('backdrop').classList.toggle('open',o);
  }
  document.getElementById('menu').onclick=function(){openDrawer(true);};
  document.getElementById('backdrop').onclick=function(){openDrawer(false);};
  document.getElementById('logout').onclick=async function(){try{await Auth.signOut();}catch(_){} location.replace('/login');};

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function md(t){return esc(t).replace(/```([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');}
  function renderMsgs(){
    if(!state.messages.length){empty.hidden=false;msgs.hidden=true;msgs.innerHTML='';return;}
    empty.hidden=true;msgs.hidden=false;
    msgs.innerHTML=state.messages.map(function(m){return m.fromUser?'<div class="user">'+esc(m.text)+'</div>':'<div class="ai">'+md(m.text)+'</div>';}).join('');
    document.getElementById('scroll').scrollTop=1e9;
  }
  function renderChats(){
    document.getElementById('chat-list').innerHTML=state.chats.map(function(c){
      return '<button type="button" class="chat-item'+(c.id===state.active?' active':'')+'" data-id="'+c.id+'">'+(c.title||c.name||'Chat')+'</button>';
    }).join('');
    document.querySelectorAll('#chat-list [data-id]').forEach(function(b){
      b.onclick=function(){openChat(b.getAttribute('data-id'));};
    });
  }
  async function loadChats(){
    try{var d=await Api.listChats();state.chats=Array.isArray(d)?d:(d.chats||[]);}catch(_){state.chats=[];}
    renderChats();
  }
  async function loadCredits(){
    try{var c=await Api.credits();document.getElementById('bal').textContent=String(c.balance!=null?c.balance:'—');}catch(_){}
  }
  async function openChat(id){
    state.active=id;state.messages=[];renderMsgs();renderChats();openDrawer(false);
    try{
      var d=await Api.getMessages(id);
      var list=Array.isArray(d)?d:(d.messages||[]);
      state.messages=list.map(function(m){return {text:m.content||m.text||'',fromUser:m.role==='user'||m.fromUser===true};});
      renderMsgs();
    }catch(_){}
  }
  document.getElementById('new-chat').onclick=function(){state.active=null;state.messages=[];renderMsgs();renderChats();openDrawer(false);};

  function updateSend(){send.disabled=!input.value.trim()||state.sending;}
  input.oninput=updateSend;
  input.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}};
  send.onclick=go;

  async function go(){
    var text=input.value.trim();if(!text||state.sending)return;
    state.messages.push({text:text,fromUser:true});input.value='';updateSend();
    state.sending=true;renderMsgs();
    try{
      if(!state.active){
        var created=await Api.createChat({});
        state.active=created.id||created.chatId;
        await loadChats();
      }
      try{await Api.saveMessage(state.active,{role:'user',content:text});}catch(_){}
      state.messages.push({text:'',fromUser:false});
      var idx=state.messages.length-1;
      var out='';
      for await (var ev of Api.chatStream({chatId:state.active,message:text,mode:'chat'})){
        var d=ev.data||{};var chunk=d.delta||d.content||d.text||d.token||'';
        if(chunk){out+=chunk;state.messages[idx].text=out;renderMsgs();}
      }
      if(!out){
        var res=await Api.chat({chatId:state.active,message:text,mode:'chat'});
        state.messages[idx].text=res.content||res.message||res.reply||'Sin respuesta';
      }
    }catch(e){state.messages.push({text:(e&&e.message)||'Error',fromUser:false});}
    finally{state.sending=false;renderMsgs();updateSend();loadCredits();loadChats();}
  }

  var qid=new URLSearchParams(location.search).get('id');
  await Promise.all([loadChats(),loadCredits()]);
  if(qid) await openChat(qid);
  renderMsgs();updateSend();
})();
</script>
</body>
</html>
