<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F9F8" />
<title>Welcome · Numination</title>
<meta name="supabase-publishable-key" content="sb_publishable_mrKTw0QGiuikjTb6SY0Hgg_Nak0QLk7" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#F7F9F8;--navy:#16325C;--ink:#111;--muted:#8A8A8A;--line:#D4D4D4;--white:#fff;--error:#C23B3B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.view{width:100%;max-width:400px}
.view[hidden]{display:none}
h1{font-size:32px;font-weight:800;text-align:center;margin-bottom:40px;letter-spacing:-.6px;line-height:1.15}
h2{font-size:26px;font-weight:800;margin-bottom:8px}
.sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.field{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 16px;background:#fff;border:1px solid var(--line);border-radius:28px;margin-bottom:12px}
.field input{flex:1;border:none;outline:none;font:inherit;padding:14px 0;background:transparent}
.btn{width:100%;height:50px;border:none;border-radius:28px;background:var(--navy);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.7}
.err{color:var(--error);font-size:13px;margin:8px 0;min-height:18px}
.socials{display:flex;justify-content:center;gap:12px;margin-top:36px}
.social{width:52px;height:52px;border-radius:14px;border:1px solid #E2E2E2;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.footer{text-align:center;margin-top:28px;color:var(--muted);font-size:14px}
.footer button{background:none;border:none;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;color:var(--ink)}
.back{width:40px;height:40px;border:none;background:none;font-size:20px;cursor:pointer;margin-bottom:12px}
</style>
</head>
<body>
<div class="view" id="entry">
  <h1>Welcome to<br/>Numination.</h1>
  <form id="form-entry">
    <label class="field"><input type="email" id="entry-email" placeholder="Correo electrónico" autocomplete="email" /></label>
    <p class="err" id="entry-error"></p>
    <button class="btn" type="submit">Continuar</button>
  </form>
  <div class="socials">
    <button type="button" class="social" id="btn-google" title="Google">G</button>
    <button type="button" class="social" id="btn-github" title="GitHub">GH</button>
  </div>
  <p class="footer">Don't have an account? <button type="button" id="btn-signup">Sign up</button></p>
</div>
<div class="view" id="password" hidden>
  <button type="button" class="back" id="back-pw">←</button>
  <h2>Ingresa tu contraseña</h2>
  <p class="sub" id="pw-email"></p>
  <form id="form-pw">
    <label class="field"><input type="password" id="pw-input" placeholder="Contraseña" autocomplete="current-password" /></label>
    <p class="err" id="pw-error"></p>
    <button class="btn" type="submit" id="btn-login">Entrar</button>
  </form>
</div>
<div class="view" id="signup" hidden>
  <button type="button" class="back" id="back-su">←</button>
  <h2>Crear cuenta</h2>
  <p class="sub">Correo y contraseña segura.</p>
  <form id="form-su">
    <label class="field"><input type="email" id="su-email" placeholder="Correo" autocomplete="email" /></label>
    <label class="field"><input type="password" id="su-pw" placeholder="Contraseña" autocomplete="new-password" /></label>
    <p class="err" id="su-error"></p>
    <button class="btn" type="submit">Crear cuenta</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
(function(){
  const Auth=window.NuminationAuth;
  const $=id=>document.getElementById(id);
  function show(name){['entry','password','signup'].forEach(v=>$(v).hidden=v!==name);}
  function isEmail(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||'').trim());}
  function msg(e){
    const m=(e&&e.message)||'';
    if(/invalid api key/i.test(m)) return 'API key inválida. Revisa deploy.';
    if(/invalid login|invalid_credentials/i.test(m)) return 'Correo o contraseña incorrectos';
    if(/email not confirmed/i.test(m)) return 'Confirma tu correo primero';
    return m||'Error';
  }
  let pending='';
  (async()=>{try{const s=await Auth.getSession();if(s)location.replace('/chat');}catch(_){}})();
  $('form-entry').onsubmit=e=>{e.preventDefault();const email=$('entry-email').value.trim();if(!isEmail(email)){$('entry-error').textContent='Correo inválido';return;}$('entry-error').textContent='';pending=email;$('pw-email').textContent=email;$('pw-input').value='';$('pw-error').textContent='';show('password');$('pw-input').focus();};
  $('back-pw').onclick=()=>show('entry');
  $('back-su').onclick=()=>show('entry');
  $('btn-signup').onclick=()=>{$('su-error').textContent='';show('signup');};
  $('form-pw').onsubmit=async e=>{e.preventDefault();const btn=$('btn-login');btn.disabled=true;try{await Auth.signInWithPassword(pending,$('pw-input').value);location.replace('/chat');}catch(ex){$('pw-error').textContent=msg(ex);}finally{btn.disabled=false;}};
  $('form-su').onsubmit=async e=>{e.preventDefault();const email=$('su-email').value.trim(),pw=$('su-pw').value;if(!isEmail(email)){$('su-error').textContent='Correo inválido';return;}if(!pw||pw.length<6){$('su-error').textContent='Mínimo 6 caracteres';return;}try{await Auth.signUp(email,pw);alert('Revisa tu correo para confirmar');show('entry');}catch(ex){$('su-error').textContent=msg(ex);}};
  $('btn-google').onclick=async()=>{try{await Auth.signInWithOAuth('google');}catch(ex){alert(msg(ex));}};
  $('btn-github').onclick=async()=>{try{await Auth.signInWithOAuth('github');}catch(ex){alert(msg(ex));}};
})();
</script>
</body>
</html>
