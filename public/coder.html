<!DOCTYPE html>
<html lang="es-CO" data-theme="gray">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coder · Numination</title>
<meta name="supabase-publishable-key" content="sb_publishable_mrKTw0QGiuikjTb6SY0Hgg_Nak0QLk7" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/themes.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text-primary);height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.bar a{color:inherit;text-decoration:none}
.main{flex:1;min-height:0;display:grid;grid-template-columns:220px 1fr}
@media(max-width:720px){.main{grid-template-columns:1fr}.files{display:none}}
.files{border-right:1px solid var(--border);padding:10px;overflow:auto;background:var(--surface)}
select{width:100%;padding:8px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:inherit;margin-bottom:8px}
.thread{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.user{align-self:flex-end;max-width:90%;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.ai{line-height:1.55}
.composer{padding:12px;border-top:1px solid var(--border)}
.box{display:flex;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px}
textarea{flex:1;border:none;outline:none;background:transparent;padding:10px;min-height:44px;resize:none;color:inherit;font:inherit}
button.send{width:42px;height:42px;border-radius:50%;border:none;background:var(--text-primary);color:var(--bg);cursor:pointer}
.work{display:flex;flex-direction:column;min-height:0}
</style>
</head>
<body>
<header class="bar"><a href="/chat">← Chat</a><strong style="flex:1">Coder</strong><a href="/projects">Proyectos</a></header>
<div class="main">
  <aside class="files"><select id="project"></select><div id="file-list"></div></aside>
  <section class="work">
    <div class="thread" id="thread"></div>
    <div class="composer"><div class="box"><textarea id="input" placeholder="Pide cambios al proyecto…"></textarea><button class="send" id="send">→</button></div></div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
(async function(){
  try{const t=localStorage.getItem('numination-theme');if(t)document.documentElement.dataset.theme=t;}catch(_){}
  if(!(await NuminationAuth.getSession())){location.replace('/login');return;}
  let projectId=new URLSearchParams(location.search).get('projectId')||'';
  const sel=document.getElementById('project');
  const thread=document.getElementById('thread');
  try{
    const projects=await NuminationApi.listProjects();
    const list=Array.isArray(projects)?projects:(projects.projects||[]);
    sel.innerHTML=list.map(p=>'<option value="'+p.id+'">'+(p.name||p.id)+'</option>').join('')||'<option value="">Sin proyectos</option>';
    if(!projectId&&list[0])projectId=list[0].id;
    if(projectId)sel.value=projectId;
  }catch(e){sel.innerHTML='<option>Error</option>';}
  async function loadFiles(){
    const el=document.getElementById('file-list');
    if(!projectId){el.textContent='';return;}
    try{const f=await NuminationApi.projectFiles(projectId);const list=Array.isArray(f)?f:(f.files||[]);el.innerHTML=list.map(x=>'<div style="padding:8px;font-family:JetBrains Mono,monospace;font-size:12px">'+(x.name||x.path)+'</div>').join('')||'<div style="padding:8px;color:var(--text-secondary)">Sin archivos</div>';}catch(e){el.textContent=e.message;}
  }
  sel.onchange=()=>{projectId=sel.value;history.replaceState(null,'','/coder?projectId='+encodeURIComponent(projectId));loadFiles();};
  await loadFiles();
  document.getElementById('send').onclick=async()=>{
    const input=document.getElementById('input');const text=input.value.trim();if(!text||!projectId)return;
    const u=document.createElement('div');u.className='user';u.textContent=text;thread.appendChild(u);input.value='';
    const a=document.createElement('div');a.className='ai';a.textContent='…';thread.appendChild(a);
    try{const res=await NuminationApi.coder({projectId,message:text,prompt:text});a.textContent=res.message||res.content||res.summary||JSON.stringify(res).slice(0,1500);await loadFiles();}catch(e){a.textContent=e.message||'Error';}
  };
})();
</script>
</body>
</html>
