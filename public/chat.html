<script>
window.__nm = window.__nm || {};
__nm.esc = function(s){ var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; };

// FIX bucle infinito de autenticación: el backend expone /api/auth/me.
// Antes se llamaba a /api/auth/session, que no existe en este flujo y dejaba
// al frontend en un ciclo de redirección sin resolver.
fetch('/api/auth/me', { credentials: 'include' })
  .then(r => r.json())
  .then(data => {
    // Blindaje: se redirige SOLO cuando la respuesta es definitivamente
    // inválida (sin ok, o sin usuario). Una respuesta ambigua (error de red,
    // cuerpo roto, timeout) NO redirige: el middleware del servidor ya
    // protege /chat cuando no hay sesión.
    if (!data || !data.ok || !data.user) { window.location.href = '/login'; return; }
    var user = data.user;
    var name = user.name || user.email || 'Usuario';
    document.querySelectorAll('[data-user-name]').forEach(el => el.textContent = name);
    document.querySelectorAll('[data-settings-email]').forEach(el => el.textContent = user.email || '');
    var pic = user.picture || user.avatar;
    var av = document.querySelector('[data-user-avatar]');
    if (av) { if(pic) av.innerHTML = `<img src="${pic}">`; else av.textContent = name.charAt(0).toUpperCase(); }
  }).catch(() => {
    // Respuesta ambigua (red caída / JSON inválido): NO se redirige.
    console.warn('[chat] no se pudo confirmar la sesión');
  });

var input = document.getElementById('chat-input');
var sendBtn = document.getElementById('chat-send');
var form = document.getElementById('chat-form');
var thread = document.getElementById('thread');
var welcome = document.getElementById('welcome');
var scroll = document.getElementById('chat-scroll');

let currentChatId = null;
let chatHistory = [];

// Cargar historial de Supabase
fetch('/api/chats', { credentials: 'include' }).then(r=>r.json()).then(async data => {
    if (data.ok && data.chats && data.chats.length > 0) {
        currentChatId = data.chats[0].id;
        const res = await fetch(`/api/chats/${currentChatId}`, { credentials: 'include' });
        const msgData = await res.json();
        if (msgData.ok && msgData.chat && msgData.chat.messages) {
            welcome.hidden = true; thread.hidden = false;
            msgData.chat.messages.forEach(msg => {
                var role = msg.role === 'user' ? 'user' : 'assistant';
                appendMessage(role, msg.content, false);
                chatHistory.push({ role: role, content: msg.content });
            });
            scroll.scrollTop = scroll.scrollHeight;
        }
    }
}).catch(()=>{});

input.addEventListener('input', () => sendBtn.disabled = !input.value.trim());

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  var text = input.value.trim();
  if (!text) return;
  input.value = ''; sendBtn.disabled = true; welcome.hidden = true; thread.hidden = false;

  chatHistory.push({ role: 'user', content: text });
  appendMessage('user', text, true);
  
  var assistantBubble = appendMessage('assistant', '', true);
  var contentEl = assistantBubble.querySelector('.message__content');
  contentEl.innerHTML = '<span style="display:inline-block;width:6px;height:6px;background:var(--c-primary);border-radius:50%;animation:pulse 1s infinite"></span>';

  if (!currentChatId) {
      try {
          const res = await fetch('/api/chats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ title: text.slice(0, 40) }) });
          const d = await res.json();
          if (d.ok && d.chat) currentChatId = d.chat.id;
      } catch (err) {}
  }

  fetch('/api/chat/stream', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
    body: JSON.stringify({ message: text, history: chatHistory.slice(0, -1), role: 'student', chatId: currentChatId })
  }).then(res => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var reader = res.body.getReader(); var dec = new TextDecoder(); var buffer = ''; var fullText = '';
    contentEl.innerHTML = '';

    function pump() {
      return reader.read().then(x => {
        if (x.done) { chatHistory.push({ role: 'assistant', content: fullText }); return; }
        buffer += dec.decode(x.value, { stream: true });
        var parts = buffer.split('\n\n'); buffer = parts.pop() || '';
        parts.forEach(p => {
          if (p.indexOf('data: ') !== 0) return;
          try {
            var evt = JSON.parse(p.slice(6));
            if (evt.token) {
              fullText += evt.token;
              contentEl.innerHTML = window.Escritura ? Escritura.render(fullText) : __nm.esc(fullText);
              scroll.scrollTop = scroll.scrollHeight;
            }
          } catch(e) {}
        });
        return pump();
      });
    }
    return pump();
  }).catch(err => { contentEl.textContent = 'Error: ' + err.message; }).finally(() => { sendBtn.disabled = false; input.focus(); });
});

function appendMessage(role, text, doScroll) {
  var div = document.createElement('div');
  div.className = 'message message--' + role;
  div.innerHTML = `${role === 'assistant' ? '<div class="message__avatar">N</div>' : ''}<div class="message__content">${role === 'assistant' ? (window.Escritura ? Escritura.render(text) : __nm.esc(text)) : __nm.esc(text)}</div>`;
  thread.appendChild(div);
  if (doScroll !== false) scroll.scrollTop = scroll.scrollHeight;
  return div;
}
</script>
