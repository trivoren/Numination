<!DOCTYPE html>
<html lang="es-CO" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin · Numination</title>
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />

<style>
/* ═══════════════════════════════════════════════════════════════════════
   TOKENS
   ═══════════════════════════════════════════════════════════════════════ */
:root, [data-theme="dark"] {
  --bg-0:#08080f;
  --bg-1:#0d0d18;
  --bg-2:#13131f;
  --bg-3:#1a1a2a;
  --bg-4:#22223a;
  --bg-hover:#1f1f30;

  --border:#22223a;
  --border-soft:#1a1a28;
  --border-strong:#2f2f48;

  --text-0:#f0f0f8;
  --text-1:#c8c8dc;
  --text-2:#8888a0;
  --text-3:#5a5a72;
  --text-4:#3a3a52;

  --primary:#7c5eff;
  --primary-hover:#8b73ff;
  --primary-soft:rgba(124,94,255,.12);
  --primary-glow:rgba(124,94,255,.35);

  --success:#22c55e;
  --success-soft:rgba(34,197,94,.12);
  --warning:#f59e0b;
  --warning-soft:rgba(245,158,11,.12);
  --danger:#ef4444;
  --danger-soft:rgba(239,68,68,.12);
  --info:#06b6d4;
  --info-soft:rgba(6,182,212,.12);

  --cyan:#22d3ee;
  --pink:#ec4899;
  --amber:#f59e0b;
  --violet:#a855f7;

  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 12px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
  --shadow-xl:0 24px 64px rgba(0,0,0,.7);

  --r-xs:4px;
  --r-sm:6px;
  --r-md:10px;
  --r-lg:14px;
  --r-xl:20px;
  --r-pill:999px;

  --sidebar-w:260px;
  --topbar-h:60px;

  --font:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;

  --t-fast:140ms cubic-bezier(.4,0,.2,1);
  --t-base:220ms cubic-bezier(.4,0,.2,1);
  --t-slow:340ms cubic-bezier(.16,1,.3,1);

  --z-sidebar:30;
  --z-topbar:20;
  --z-modal:100;
  --z-toast:9999;
}

[data-theme="light"] {
  --bg-0:#f5f5f8;
  --bg-1:#ffffff;
  --bg-2:#f7f7fa;
  --bg-3:#eef0f5;
  --bg-4:#e4e4ec;
  --bg-hover:#f0f0f5;

  --border:#e0e0e8;
  --border-soft:#ececf2;
  --border-strong:#c8c8d4;

  --text-0:#0a0a14;
  --text-1:#2a2a3c;
  --text-2:#5a5a72;
  --text-3:#8888a0;
  --text-4:#b8b8c8;

  --primary:#6b4eff;
  --primary-hover:#5a3de6;
  --primary-soft:rgba(107,78,255,.08);
  --primary-glow:rgba(107,78,255,.2);

  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --shadow-xl:0 24px 64px rgba(0,0,0,.15);
}

/* ═══════════════════════════════════════════════════════════════════════
   RESET
   ═══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; width:100%; }
body {
  font-family:var(--font);
  background:var(--bg-0);
  color:var(--text-0);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
  font-feature-settings:'cv11','ss01';
}
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; -webkit-tap-highlight-color:transparent; text-align:inherit; font-size:inherit; }
button:disabled { cursor:not-allowed; opacity:.5; }
input, textarea, select { font-family:inherit; font-size:inherit; color:inherit; background:none; border:none; outline:none; }
a { color:inherit; text-decoration:none; }
svg { display:block; max-width:100%; }

::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:6px; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background:var(--text-4); background-clip:content-box; }

::selection { background:var(--primary-glow); color:var(--text-0); }

/* ═══════════════════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════════════════ */
.admin {
  display:flex;
  height:100vh;
  height:100dvh;
  width:100vw;
  overflow:hidden;
}

/* ═══════════════════════════════════════════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════════════════════════════════════════ */
.sidebar {
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-1);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  z-index:var(--z-sidebar);
  transition:transform var(--t-base);
}

.sidebar__head {
  padding:18px 16px 14px;
  border-bottom:1px solid var(--border-soft);
  display:flex;
  align-items:center;
  gap:12px;
}

.sidebar__logo {
  width:36px;height:36px;
  border-radius:var(--r-md);
  background:linear-gradient(135deg, var(--primary), var(--violet));
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:800;
  font-size:16px;
  flex-shrink:0;
  box-shadow:0 4px 14px var(--primary-glow);
}

.sidebar__brand {
  flex:1;
  min-width:0;
}

.sidebar__name {
  font-size:14px;
  font-weight:700;
  letter-spacing:-.02em;
  color:var(--text-0);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sidebar__tag {
  font-size:10.5px;
  color:var(--text-3);
  font-weight:500;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.sidebar__nav {
  flex:1;
  overflow-y:auto;
  padding:12px 10px;
  display:flex;
  flex-direction:column;
  gap:2px;
}

.sidebar__section {
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text-4);
  padding:14px 10px 6px;
}
.sidebar__section:first-child { padding-top:2px; }

.nav-item {
  display:flex;
  align-items:center;
  gap:11px;
  padding:9px 11px;
  border-radius:var(--r-sm);
  color:var(--text-2);
  font-size:13.5px;
  font-weight:500;
  transition:all var(--t-fast);
  position:relative;
  cursor:pointer;
  width:100%;
}
.nav-item:hover { background:var(--bg-hover); color:var(--text-0); }
.nav-item.is-active {
  background:var(--primary-soft);
  color:var(--primary);
  font-weight:600;
}
.nav-item.is-active::before {
  content:'';
  position:absolute;
  left:-10px;
  top:50%;
  transform:translateY(-50%);
  width:3px;
  height:20px;
  background:var(--primary);
  border-radius:0 3px 3px 0;
}
.nav-item svg {
  width:18px;
  height:18px;
  flex-shrink:0;
  stroke-width:1.9;
}
.nav-item__badge {
  margin-left:auto;
  padding:1px 7px;
  border-radius:var(--r-pill);
  background:var(--danger);
  color:#fff;
  font-size:10.5px;
  font-weight:700;
  min-width:20px;
  text-align:center;
  flex-shrink:0;
}
.nav-item__badge.is-neutral {
  background:var(--bg-4);
  color:var(--text-2);
}

.sidebar__foot {
  padding:14px 16px;
  border-top:1px solid var(--border-soft);
  display:flex;
  align-items:center;
  gap:10px;
}

.sidebar__user {
  width:32px;height:32px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:12px;
  flex-shrink:0;
}

.sidebar__userinfo {
  flex:1;
  min-width:0;
}

.sidebar__userinfo-name {
  font-size:13px;
  font-weight:600;
  color:var(--text-0);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sidebar__userinfo-mail {
  font-size:11px;
  color:var(--text-3);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sidebar__logout {
  padding:6px;
  border-radius:var(--r-sm);
  color:var(--text-3);
  transition:all var(--t-fast);
  flex-shrink:0;
}
.sidebar__logout:hover { background:var(--danger-soft); color:var(--danger); }
.sidebar__logout svg { width:16px; height:16px; }

/* ═══════════════════════════════════════════════════════════════════════
   MAIN
   ═══════════════════════════════════════════════════════════════════════ */
.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:var(--bg-0);
  overflow:hidden;
}

.topbar {
  height:var(--topbar-h);
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  background:var(--bg-1);
  z-index:var(--z-topbar);
}

.topbar__menu {
  display:none;
  padding:8px;
  border-radius:var(--r-sm);
  color:var(--text-1);
  transition:background var(--t-fast);
}
.topbar__menu:hover { background:var(--bg-hover); }
.topbar__menu svg { width:20px; height:20px; }

.topbar__title {
  font-size:15px;
  font-weight:700;
  letter-spacing:-.02em;
  color:var(--text-0);
  display:flex;
  align-items:center;
  gap:10px;
}

.topbar__title-crumb {
  color:var(--text-3);
  font-weight:500;
}

.topbar__spacer { flex:1; }

.topbar__search {
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  height:36px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  width:280px;
  transition:all var(--t-fast);
}
.topbar__search:focus-within {
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-glow);
  background:var(--bg-1);
}
.topbar__search svg {
  width:15px;height:15px;
  color:var(--text-3);
  flex-shrink:0;
}
.topbar__search input {
  flex:1;
  min-width:0;
  font-size:13px;
  color:var(--text-0);
}
.topbar__search input::placeholder { color:var(--text-4); }
.topbar__search kbd {
  font-family:var(--mono);
  font-size:10.5px;
  padding:2px 6px;
  background:var(--bg-4);
  border-radius:4px;
  color:var(--text-3);
  border:1px solid var(--border-soft);
}

.topbar__btn {
  width:36px;height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:var(--r-sm);
  color:var(--text-2);
  transition:all var(--t-fast);
  position:relative;
  flex-shrink:0;
}
.topbar__btn:hover { background:var(--bg-hover); color:var(--text-0); }
.topbar__btn svg { width:17px; height:17px; stroke-width:1.9; }
.topbar__btn.is-loading svg { animation:spin 1s linear infinite; }

.topbar__btn-dot {
  position:absolute;
  top:7px;
  right:7px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--danger);
  border:2px solid var(--bg-1);
}

@keyframes spin { to { transform:rotate(360deg); } }

.view-container {
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:24px;
  position:relative;
}

@media (min-width: 1280px) {
  .view-container { padding:32px 40px; }
}

.view {
  max-width:1600px;
  margin:0 auto;
  animation:fadeIn .25s var(--t-slow);
}
@keyframes fadeIn {
  from { opacity:0; transform:translateY(6px); }
  to { opacity:1; transform:translateY(0); }
}

/* ═══════════════════════════════════════════════════════════════════════
   PAGE HEADER
   ═══════════════════════════════════════════════════════════════════════ */
.page-head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:24px;
  flex-wrap:wrap;
}

.page-head__text {
  flex:1;
  min-width:220px;
}

.page-head__title {
  font-size:22px;
  font-weight:800;
  letter-spacing:-.028em;
  color:var(--text-0);
  margin-bottom:4px;
  line-height:1.2;
}

.page-head__sub {
  font-size:13.5px;
  color:var(--text-2);
  letter-spacing:-.005em;
}

.page-head__actions {
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

/* ═══════════════════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════════════════ */
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:8px 14px;
  border-radius:var(--r-sm);
  font-size:13px;
  font-weight:600;
  letter-spacing:-.005em;
  transition:all var(--t-fast);
  border:1px solid transparent;
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
}
.btn svg { width:14px; height:14px; stroke-width:2; flex-shrink:0; }
.btn:disabled { opacity:.5; cursor:not-allowed; }

.btn--primary {
  background:var(--primary);
  color:#fff;
  box-shadow:0 2px 8px var(--primary-glow);
}
.btn--primary:hover:not(:disabled) {
  background:var(--primary-hover);
  transform:translateY(-1px);
  box-shadow:0 4px 14px var(--primary-glow);
}
.btn--primary:active:not(:disabled) { transform:translateY(0); }

.btn--secondary {
  background:var(--bg-2);
  color:var(--text-0);
  border-color:var(--border);
}
.btn--secondary:hover:not(:disabled) {
  background:var(--bg-3);
  border-color:var(--border-strong);
}

.btn--ghost {
  background:transparent;
  color:var(--text-2);
}
.btn--ghost:hover:not(:disabled) {
  background:var(--bg-hover);
  color:var(--text-0);
}

.btn--danger {
  background:var(--danger);
  color:#fff;
}
.btn--danger:hover:not(:disabled) {
  filter:brightness(1.1);
  transform:translateY(-1px);
}

.btn--sm {
  padding:6px 11px;
  font-size:12px;
}
.btn--sm svg { width:12px; height:12px; }

.btn--icon {
  width:32px;
  height:32px;
  padding:0;
}
.btn--icon svg { width:15px; height:15px; }

/* ═══════════════════════════════════════════════════════════════════════
   CARDS
   ═══════════════════════════════════════════════════════════════════════ */
.card {
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:20px;
  transition:border-color var(--t-fast);
}
.card:hover { border-color:var(--border-strong); }

.card--flush { padding:0; overflow:hidden; }

.card__head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 20px;
  border-bottom:1px solid var(--border-soft);
  flex-wrap:wrap;
}

.card__title {
  font-size:14.5px;
  font-weight:700;
  letter-spacing:-.015em;
  color:var(--text-0);
  display:flex;
  align-items:center;
  gap:8px;
}
.card__title svg { width:16px; height:16px; color:var(--text-3); stroke-width:2; }

.card__sub {
  font-size:12.5px;
  color:var(--text-3);
  margin-top:2px;
}

.card__body { padding:20px; }
.card__body--flush { padding:0; }

/* ═══════════════════════════════════════════════════════════════════════
   GRID
   ═══════════════════════════════════════════════════════════════════════ */
.grid {
  display:grid;
  gap:16px;
}
.grid--2 { grid-template-columns:repeat(2, minmax(0, 1fr)); }
.grid--3 { grid-template-columns:repeat(3, minmax(0, 1fr)); }
.grid--4 { grid-template-columns:repeat(4, minmax(0, 1fr)); }

@media (max-width: 1200px) {
  .grid--4 { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .grid--3 { grid-template-columns:repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .grid--2, .grid--3, .grid--4 { grid-template-columns:1fr; }
}

/* ═══════════════════════════════════════════════════════════════════════
   STAT CARD
   ═══════════════════════════════════════════════════════════════════════ */
.stat {
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
  transition:all var(--t-fast);
  position:relative;
  overflow:hidden;
}
.stat:hover { border-color:var(--border-strong); transform:translateY(-1px); }
.stat__label {
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.03em;
  text-transform:uppercase;
  color:var(--text-3);
  display:flex;
  align-items:center;
  gap:6px;
}
.stat__label svg { width:14px; height:14px; }
.stat__value {
  font-size:28px;
  font-weight:800;
  letter-spacing:-.035em;
  color:var(--text-0);
  line-height:1;
  font-feature-settings:'tnum';
  display:flex;
  align-items:baseline;
  gap:8px;
}
.stat__unit {
  font-size:13px;
  font-weight:500;
  color:var(--text-3);
}
.stat__delta {
  font-size:12px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:2px 7px;
  border-radius:var(--r-pill);
}
.stat__delta.is-up {
  color:var(--success);
  background:var(--success-soft);
}
.stat__delta.is-down {
  color:var(--danger);
  background:var(--danger-soft);
}
.stat__delta.is-flat {
  color:var(--text-3);
  background:var(--bg-3);
}
.stat__icon {
  position:absolute;
  top:14px;
  right:14px;
  width:34px;
  height:34px;
  border-radius:var(--r-sm);
  display:flex;
  align-items:center;
  justify-content:center;
}
.stat__icon svg { width:16px; height:16px; stroke-width:2; }

/* ═══════════════════════════════════════════════════════════════════════
   CHART
   ═══════════════════════════════════════════════════════════════════════ */
.chart {
  width:100%;
  height:240px;
  position:relative;
}
.chart svg { width:100%; height:100%; overflow:visible; }

.chart__axis {
  stroke:var(--border);
  stroke-width:1;
  stroke-dasharray:2 3;
}
.chart__axis-text {
  fill:var(--text-3);
  font-size:10.5px;
  font-family:var(--mono);
  font-weight:500;
}
.chart__line {
  fill:none;
  stroke:var(--primary);
  stroke-width:2.2;
  stroke-linejoin:round;
  stroke-linecap:round;
  filter:drop-shadow(0 2px 6px var(--primary-glow));
}
.chart__area {
  fill:url(#areaGrad);
  opacity:.4;
}
.chart__dot {
  fill:var(--bg-1);
  stroke:var(--primary);
  stroke-width:2;
  transition:r var(--t-fast);
  cursor:pointer;
}
.chart__dot:hover { r:6; }

.chart-bars {
  display:flex;
  align-items:flex-end;
  gap:6px;
  height:100%;
  padding:16px 8px 28px;
}
.chart-bar {
  flex:1;
  min-width:6px;
  background:linear-gradient(180deg, var(--primary), var(--violet));
  border-radius:4px 4px 0 0;
  transition:all var(--t-fast);
  position:relative;
  cursor:pointer;
  opacity:.85;
}
.chart-bar:hover { opacity:1; transform:scaleY(1.02); }
.chart-bar__label {
  position:absolute;
  bottom:-22px;
  left:50%;
  transform:translateX(-50%);
  font-size:9.5px;
  color:var(--text-3);
  white-space:nowrap;
  font-family:var(--mono);
  font-weight:500;
}
.chart-bar__val {
  position:absolute;
  top:-20px;
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  color:var(--text-2);
  font-weight:700;
  font-family:var(--mono);
  white-space:nowrap;
  opacity:0;
  transition:opacity var(--t-fast);
}
.chart-bar:hover .chart-bar__val { opacity:1; }

.field__textarea:focus,

}

/* Toggle */
.toggle {

}
.toggle__input {

  width:0;height:0;
}
.toggle__box {

  height:22px;
  border-radius:var(--r-pill);
  background:var(--bg-4);
  position:relative;
  transition:background var(--t-fast);
  flex-shrink:0;
}
.toggle__box::after {
  content:'';
  position:absolute;
  top:2px;left:2px;

  box-shadow:0 1px 3px rgba(0,0,0,.3);
}

/* ═══════════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════════ */
.tabs {

/* ═══════════════════════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════════════════════

.skeleton {

}

  100% { background-position:-200% 0; }

/* ═══════════════════════════════════════════════════════════════════════
   TOASTS
   ═══════════════════════════════════════════════════════════════════════ */
.toasts {
  position:fixed;
  bottom:20px;
  right:20px;

  flex-direction:column;
  gap:8px;
  z-index:var(--z-toast);

}

}

.toast__body { flex:1; min-width:0; }
.toast__title {

}

}
@keyframes toastIn {
  from { transform:translateX(24px); opacity:0; }
  to { transform:translateX(0); opacity:1; }
}

/* ═══════════════════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════════════════ */
.modal-backdrop {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);

  justify-content:center;

  animation:fadeIn .2s;

.modal {

}

}

}

.modal__foot {

'use strict';

   STATE
   ───────────────────────────────────────────────────────────────────── */

  autoRefreshTimer: null,

  unreadAlerts: 0,
};

/* ─────────────────────────────────────────────────────────────────────
   UTILITIES
   ───────────────────────────────────────────────────────────────────── */
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') node.innerHTML = v;
    else if (v !== false && v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return node;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmtNumber(n) {
  if (n == null || !isFinite(n)) return '—';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(Math.round(n));
}

function fmtBytes(n) {
  if (n == null || !isFinite(n)) return '—';
  if (n >= 1024 * 1024 * 1024) return (n / (1024*1024*1024)).toFixed(1) + ' GB';
  if (n >= 1024 * 1024) return (n / (1024*1024)).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}

function fmtDuration(ms) {
  if (ms == null || !isFinite(ms)) return '—';
  if (ms < 1000) return Math.round(ms) + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  if (ms < 3600000) return Math.floor(ms / 60000) + 'm ' + Math.round((ms % 60000) / 1000) + 's';
  return Math.floor(ms / 3600000) + 'h ' + Math.floor((ms % 3600000) / 60000) + 'm';
}

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString('es-CO', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  } catch { return '—'; }
}

function fmtRelative(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const diff = Date.now() - d.getTime();
    if (diff < 60000) return 'hace ' + Math.floor(diff / 1000) + 's';
    if (diff < 3600000) return 'hace ' + Math.floor(diff / 60000) + 'm';
    if (diff < 86400000) return 'hace ' + Math.floor(diff / 3600000) + 'h';
    if (diff < 604800000) return 'hace ' + Math.floor(diff / 86400000) + 'd';
    return fmtDate(iso);
  } catch { return '—'; }
}

function fmtPct(n, decimals = 1) {
  if (n == null || !isFinite(n)) return '—';
  return (n * 100).toFixed(decimals) + '%';
}

function getTheme() {
  return localStorage.getItem('admin-theme') || 'dark';
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('admin-theme', t);
}

/* ─────────────────────────────────────────────────────────────────────
   API CLIENT
   ───────────────────────────────────────────────────────────────────── */
async function api(path, opts = {}) {
  const url = path.startsWith('http') ? path : path;
  const config = {
    credentials: 'include',
    headers: { 'Accept': 'application/json', ...(opts.headers || {}) },
    method: opts.method || 'GET',
    signal: opts.signal || AbortSignal.timeout(opts.timeout || 15000),
  };

  if (opts.body !== undefined) {
    if (typeof opts.body === 'string') {
      config.body = opts.body;
    } else {
      config.body = JSON.stringify(opts.body);
      config.headers['Content-Type'] = 'application/json';
    }
  }

  try {
    const res = await fetch(url, config);

    if (res.status === 401) {
      Toast.error('Sesión expirada', 'Volvé a iniciar sesión');
      setTimeout(() => location.href = '/login', 1200);
      throw new Error('session_expired');
    }
    if (res.status === 403) {
      throw new Error('Sin permisos de admin');
    }

    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; } catch {}

    if (!res.ok) {
      const msg = (json && (json.error || json.message)) || ('Error ' + res.status);
      throw Object.assign(new Error(msg), { status: res.status, data: json });
    }

    return json;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Timeout');
    throw e;
  }
}

/* ─────────────────────────────────────────────────────────────────────
   TOAST
   ───────────────────────────────────────────────────────────────────── */
const Toast = (() => {
  const host = () => document.getElementById('toasts');
  const active = new Map();

  function dismiss(id) {
    const e = active.get(id);
    if (!e) return;
    clearTimeout(e.timer);
    e.el.style.transition = 'opacity .3s, transform .3s';
    e.el.style.opacity = '0';
    e.el.style.transform = 'translateX(24px)';
    setTimeout(() => e.el.remove(), 320);
    active.delete(id);
  }

  function push(kind, title, msg, ttl = 4000) {
    const id = 't_' + Date.now() + Math.random().toString(36).slice(2, 6);
    const icon = { ok:'✓', err:'✕', warn:'!', info:'i' }[kind] || '·';
    const node = el('div', { class: 'toast toast--' + kind },
      el('div', { class: 'toast__icon' }, icon),
      el('div', { class: 'toast__body' },
        title ? el('div', { class: 'toast__title' }, title) : null,
        msg ? el('div', { class: 'toast__msg' }, msg) : null,
      ),
    );
    host().appendChild(node);

    if (active.size >= 5) dismiss(active.keys().next().value);

    const timer = setTimeout(() => dismiss(id), ttl);
    node.addEventListener('click', () => dismiss(id));
    active.set(id, { el: node, timer });
  }

  return {
    ok: (t, m) => push('ok', t, m),
    err: (t, m) => push('err', t, m, 5500),
    warn: (t, m) => push('warn', t, m, 4500),
    info: (t, m) => push('info', t, m),
  };
})();

/* ─────────────────────────────────────────────────────────────────────
   MODAL
   ───────────────────────────────────────────────────────────────────── */
const Modal = (() => {
  const root = () => document.getElementById('modal-root');

  function open({ title, body, footer, size = '', onClose }) {
    const backdrop = el('div', { class: 'modal-backdrop' });
    const modal = el('div', { class: 'modal ' + (size ? 'modal--' + size : '') });

    const closeBtn = el('button', { class: 'modal__close', 'aria-label': 'Cerrar', html:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    });

    const head = el('div', { class: 'modal__head' },
      el('div', { class: 'modal__title' }, title || ''),
      closeBtn,
    );

    const bodyNode = el('div', { class: 'modal__body' });
    if (typeof body === 'string') bodyNode.innerHTML = body;
    else if (body) bodyNode.appendChild(body);

    modal.appendChild(head);
    modal.appendChild(bodyNode);

    if (footer) {
      const foot = el('div', { class: 'modal__foot' });
      if (typeof footer === 'string') foot.innerHTML = footer;
      else if (footer instanceof Node) foot.appendChild(footer);
      else if (Array.isArray(footer)) footer.forEach(f => foot.appendChild(f));
      modal.appendChild(foot);
    }

    backdrop.appendChild(modal);
    root().appendChild(backdrop);

    function close() {
      backdrop.style.opacity = '0';
      setTimeout(() => {
        backdrop.remove();
        if (onClose) onClose();
      }, 180);
    }

    closeBtn.addEventListener('click', close);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    document.addEventListener('keydown', function handler(e) {
      if (e.key === 'Escape') { close(); document.removeEventListener('keydown', handler); }
    });

    return { close, modal, body: bodyNode };
  }

  function confirm({ title, message, confirmLabel = 'Confirmar', danger = false }) {
    return new Promise((resolve) => {
      const modal = open({
        title,
        body: el('p', { style: 'font-size:14px;line-height:1.6;color:var(--text-1)' }, message),
        footer: [
          el('button', { class: 'btn btn--ghost', onclick: () => { modal.close(); resolve(false); } }, 'Cancelar'),
          el('button', { class: 'btn ' + (danger ? 'btn--danger' : 'btn--primary'), onclick: () => { modal.close(); resolve(true); } }, confirmLabel),
        ],
        onClose: () => resolve(false),
      });
    });
  }

  function prompt({ title, label, placeholder = '', value = '', required = true }) {
    return new Promise((resolve) => {
      const input = el('input', {
        class: 'field__input',
        type: 'text',
        placeholder,
        value,
      });
      const body = el('div', { class: 'field' },
        label ? el('label', { class: 'field__label' }, label) : null,
        input,
      );
      const modal = open({
        title,
        body,
        footer: [
          el('button', { class: 'btn btn--ghost', onclick: () => { modal.close(); resolve(null); } }, 'Cancelar'),
          el('button', { class: 'btn btn--primary', onclick: () => {
            const v = input.value.trim();
            if (required && !v) { Toast.warn('Campo requerido'); return; }
            modal.close();
            resolve(v);
          } }, 'Guardar'),
        ],
        onClose: () => resolve(null),
      });
      setTimeout(() => input.focus(), 100);
    });
  }

  return { open, confirm, prompt };
})();

   ───────────────────────────────────────────────────────────────────── */
const Router = (() => {
  function parse() {
    const hash = location.hash.replace(/^#\/?/, '');
    const [route, ...rest] = hash.split('/');
    return { route: route || 'dashboard', params: rest };
  }

  function navigate(route) {
    location.hash = '#/' + route;
  }

  function onRoute(callback) {
    window.addEventListener('hashchange', () => {
      const { route, params } = parse();
      callback(route, params);
    });
    callback(...Object.values(parse()));
  }

  return { parse, navigate, onRoute };
})();

async function loadDashboard() {
  try {

      api('/api/admin/health'),

      api('/api/admin/metrics'),
    ]);

      renderStatCards(analytics.value);
      renderDauChart(analytics.value.active?.trend || []);
      renderProvidersDonut(analytics.value.providers || []);
      renderTopEvents(analytics.value.topEvents || []);
    } else {

    }

    if (health.status === 'fulfilled') {
      renderHealth(health.value);
    } else {

    if (metrics.status === 'fulfilled') {

function renderDauChart(trend) {
  const host = document.getElementById('dau-chart');
  if (!host) return;

  if (!Array.isArray(trend) || trend.length === 0) {
    host.innerHTML = `<div class="empty"><div class="empty__icon">${Icon.activity}</div><div class="empty__title">Sin datos</div></div>`;
    return;
  }

  const max = Math.max(...trend, 1);
  host.innerHTML = `
    <div class="chart-bars">
      ${trend.slice(-30).map((v, i, arr) => {
        const h = (v / max) * 100;
        const isLast = i === arr.length - 1;
        const daysAgo = arr.length - 1 - i;
        const label = daysAgo === 0 ? 'hoy' : daysAgo === 1 ? 'ayer' : `${daysAgo}d`;
        return `
          <div class="chart-bar" style="height:${Math.max(h, 2)}%" title="${v} usuarios · ${label}">
            <span class="chart-bar__val">${v}</span>
            ${i % Math.ceil(arr.length / 8) === 0 || isLast ? `<span class="chart-bar__label">${label}</span>` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderProvidersDonut(providers) {
  const host = document.getElementById('providers-donut');
  if (!host) return;

  if (!Array.isArray(providers) || providers.length === 0) {
    host.innerHTML = `<div class="empty"><div class="empty__icon">${Icon.zap}</div><div class="empty__title">Sin datos</div></div>`;
    return;
  }

  const total = providers.reduce((s, p) => s + (p.count || 0), 0) || 1;
  const colors = { groq: 'var(--primary)', gemini: 'var(--info)', nvidia: 'var(--pink)', kimi: 'var(--pink)' };

  let offset = 0;
  const circumference = 2 * Math.PI * 60;
  const segments = providers.map(p => {
    const pct = (p.count || 0) / total;
    const dash = pct * circumference;
    const seg = { ...p, dash, offset, color: colors[p.provider] || 'var(--text-3)' };
    offset += dash;
    return seg;
  });

  host.innerHTML = `
    <div class="donut">
      <div class="donut__svg">
        <svg viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="60" fill="none" stroke="var(--bg-3)" stroke-width="22"/>
          ${segments.map(s => `
            <circle cx="70" cy="70" r="60" fill="none" stroke="${s.color}" stroke-width="22"
              stroke-dasharray="${s.dash} ${circumference - s.dash}"
              stroke-dashoffset="${-s.offset}"
              stroke-linecap="butt"/>
          `).join('')}
        </svg>
        <div class="donut__center">
          <div class="donut__center-value">${fmtNumber(total)}</div>
          <div class="donut__center-label">llamadas</div>
        </div>
      </div>
      <div class="donut__legend">
        ${segments.map(s => `
          <div class="donut__item">
            <span class="donut__item-dot" style="background:${s.color}"></span>
            <span class="donut__item-name">${esc(capitalize(s.provider))}</span>
            <span class="donut__item-val">${fmtNumber(s.count)}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function capitalize(s) {
  s = String(s || '');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

  host.innerHTML = `<div class="card"><div class="card__body"><div class="skeleton" style="height:240px"></div></div></div>`;

  try {

      const [dau, providers, plans] = await Promise.all([
        api('/api/admin/analytics/dau?days=' + days),
        api('/api/admin/analytics/events?days=' + days),

async function loadUsers() {
  const host = document.getElementById('users-list');
  try {
    const metrics = await api('/api/admin/metrics');
    const offenders = metrics?.rateLimit?.topOffenders || [];
    const errorUsers = metrics?.errors?.topUsers || [];

    const allUsers = new Map();
    offenders.forEach(o => allUsers.set(o.key, { ...allUsers.get(o.key), id: o.key, rateLimitEvents: o.count }));
    errorUsers.forEach(o => allUsers.set(o.key, { ...allUsers.get(o.key), id: o.key, errorEvents: o.count }));

    const list = Array.from(allUsers.values());

    if (list.length === 0) {
      host.innerHTML = `<div class="empty" style="padding:48px 20px"><div class="empty__icon">${Icon.users}</div><div class="empty__title">Sin datos de usuarios</div><div class="empty__sub">Los usuarios aparecerán acá cuando haya actividad</div></div>`;
      return;
    }

    host.innerHTML = `
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Eventos rate limit</th>
              <th>Errores</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(u => `
              <tr>
                <td class="mono">${esc(u.id.slice(0, 16))}…</td>
                <td>${u.rateLimitEvents ? `<span class="badge badge--warning">${u.rateLimitEvents}</span>` : '<span class="text-muted">—</span>'}</td>
                <td>${u.errorEvents ? `<span class="badge badge--danger">${u.errorEvents}</span>` : '<span class="text-muted">—</span>'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch (e) {
    host.innerHTML = `<div class="empty" style="padding:48px 20px"><div class="empty__icon">${Icon.alert}</div><div class="empty__title">Error</div><div class="empty__sub">${esc(e.message)}</div></div>`;
  }
}

                <td class="mono" style="color:var(--text-3)">${fmtRelative(m.appliedAt)}</td>
              </tr>
            `).join('')}
            ${pending.map(m => `
              <tr style="opacity:.6">
                <td><span class="badge badge--warning">${Icon.clock}</span></td>
                <td class="mono" style="font-size:12px">${esc(m.id)}</td>
                <td>${esc(m.name)}</td>
                <td>—</td>
                <td>—</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;

    // Actualizar badge del sidebar
    const badge = document.getElementById('badge-migrations');

      badge.style.color = '';

    Toast.err('Error cargando migraciones', e.message);

      } catch (e) { Toast.err('Error', e.message); }
    });

    document.getElementById('notif-test').addEventListener('click', () => {
      const subject = el('input', { class: 'field__input', placeholder: 'Asunto', value: 'Test de admin' });
      const message = el('textarea', { class: 'field__textarea', placeholder: 'Mensaje', value: 'Esta es una prueba desde el panel de admin.' });

      const modal = Modal.open({
        title: 'Enviar notificación de prueba',
        body: el('div', {},
          el('div', { class: 'field' }, el('label', { class: 'field__label' }, 'Asunto'), subject),
          el('div', { class: 'field' }, el('label', { class: 'field__label' }, 'Mensaje'), message),

        footer: [
          el('button', { class: 'btn btn--ghost', onclick: () => modal.close() }, 'Cancelar'),
          el('button', { class: 'btn btn--primary', onclick: async () => {

              await api('/api/admin/notify', {
                method: 'POST',

      });

  },

async function loadNotifications() {
  try {
    const data = await api('/api/notifications?limit=50');
    const list = data.notifications || [];

    // Actualizar badge
    const badge = document.getElementById('badge-notifications');
    if (badge) {
      if (data.unread > 0) {
        badge.textContent = String(data.unread);
        badge.hidden = false;
      } else {
        badge.hidden = true;
      }
    }

    const host = document.getElementById('notif-inbox');
    if (list.length === 0) {
      host.innerHTML = `<div class="empty" style="padding:48px 20px"><div class="empty__icon">${Icon.info}</div><div class="empty__title">Sin notificaciones</div><div class="empty__sub">Las notificaciones aparecerán acá</div></div>`;
      return;
    }

    host.innerHTML = list.map(n => `
      <div class="file-row" style="${!n.read ? 'background:var(--primary-soft);border-left:3px solid var(--primary)' : ''}">
        <div class="file-row__icon ${n.priority === 'urgent' ? 'is-danger' : n.priority === 'high' ? 'is-warning' : 'is-primary'}">
          ${n.priority === 'urgent' ? Icon.alert : n.priority === 'high' ? Icon.alert : Icon.info}
        </div>
        <div class="file-row__body">
          <div class="file-row__title">${esc(n.title)}</div>
          <div class="file-row__meta" style="font-family:inherit;font-size:12.5px;color:var(--text-2);margin-top:4px">${esc(n.body)}</div>
          <div class="file-row__meta">${esc(n.type)} · ${fmtRelative(n.createdAt)}</div>
        </div>
        ${!n.read ? `<button class="btn btn--ghost btn--sm" data-mark="${esc(n.id)}">Marcar leída</button>` : ''}
      </div>
    `).join('');

    host.querySelectorAll('[data-mark]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          await api('/api/notifications/' + btn.dataset.mark + '/read', { method: 'POST' });
          loadNotifications();
        } catch {}
      });
    });
  } catch (e) {
    Toast.err('Error cargando notificaciones', e.message);
  }
}

async function doSearch(q, type) {
  q = String(q || '').trim();
  const host = document.getElementById('search-results');

  if (q.length < 2) {
    host.innerHTML = `<div class="card"><div class="card__body"><div class="empty"><div class="empty__icon">${Icon.activity}</div><div class="empty__title">Escribí algo para empezar</div><div class="empty__sub">Mínimo 2 caracteres</div></div></div></div>`;
    return;
  }

  host.innerHTML = `<div class="card"><div class="card__body"><div class="skeleton" style="height:150px"></div></div></div>`;

  try {
    const params = new URLSearchParams({ q, limit: '50' });
    if (type !== 'all') params.set('types', type);

    const data = await api('/api/search?' + params.toString());
    const items = data.items || [];

    if (items.length === 0) {
      host.innerHTML = `<div class="card"><div class="card__body"><div class="empty"><div class="empty__icon">${Icon.activity}</div><div class="empty__title">Sin resultados</div><div class="empty__sub">Probá con otra búsqueda</div></div></div></div>`;
      return;
    }

    host.innerHTML = `
      <div class="card card--flush">
        <div class="card__head">
          <div>
            <div class="card__title">${items.length} resultados</div>
            <div class="card__sub">En ${data.took || 0}ms · ${data.cached ? 'cache' : 'live'}</div>
          </div>
        </div>
        <div class="card__body card__body--flush">
          ${items.map(item => `
            <div class="file-row" onclick="window.open('${item.url || '#'}', '_blank')" style="cursor:pointer">
              <div class="file-row__icon ${item.type === 'messages' ? 'is-primary' : item.type === 'memories' ? 'is-warning' : 'is-success'}">
                ${item.type === 'chats' ? Icon.activity : item.type === 'messages' ? Icon.file : item.type === 'memories' ? Icon.zap : Icon.db}
              </div>
              <div class="file-row__body">
                <div class="file-row__title">${esc(item.title)}</div>
                <div class="file-row__meta">${esc(item.snippet || item.content || '')}</div>
              </div>
              <span class="badge badge--${item.type === 'messages' ? 'primary' : item.type === 'memories' ? 'warning' : 'success'}">${esc(item.type)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } catch (e) {
    host.innerHTML = `<div class="card"><div class="card__body"><div class="empty"><div class="empty__icon">${Icon.alert}</div><div class="empty__title">Error</div><div class="empty__sub">${esc(e.message)}</div></div></div></div>`;
  }
}

async function loadTrending() {
  try {
    const data = await api('/api/search/trending?limit=10');
    const list = data.trending || [];
    const host = document.getElementById('trending-list');

    if (list.length === 0) {
      host.innerHTML = `<div class="empty" style="padding:32px 20px"><div class="empty__title">Sin búsquedas trending</div></div>`;
      return;
    }

    host.innerHTML = list.map(t => `
      <div class="file-row" style="cursor:pointer" onclick="document.getElementById('search-input').value=${JSON.stringify(t.query)}; document.getElementById('search-input').dispatchEvent(new Event('input'));">
        <div class="file-row__icon is-primary">${Icon.activity}</div>
        <div class="file-row__body">
          <div class="file-row__title">${esc(t.query)}</div>
          <div class="file-row__meta">${t.count} búsquedas</div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    // silent
  }
}

async function loadLogs() {
  try {
    const [health, metrics, raw] = await Promise.all([
      api('/api/admin/health'),
      api('/api/admin/metrics'),
      api('/api/health'),
    ]);

    // Health
    const hHost = document.getElementById('logs-health');
    const healthRows = [
      { name: 'Base de datos', data: health.db },
      { name: 'Rate limiting', data: health.limits },
      { name: 'Analytics', data: health.analytics },
      { name: 'Webhooks', data: health.webhooks },
    ];
    hHost.innerHTML = healthRows.map(r => {
      const ok = r.data?.ok !== false;
      return `
        <div class="health-row">
          <span class="health-row__dot ${ok ? 'is-ok' : 'is-err'}"></span>
          <span class="health-row__name">${esc(r.name)}</span>
          <span class="health-row__val">${r.data?.latencyMs != null ? r.data.latencyMs + 'ms' : (ok ? 'OK' : 'error')}</span>
        </div>
      `;
    }).join('');

    // Errors
    const errHost = document.getElementById('logs-errors');
    const errors = metrics.errors?.topCodes || [];
    if (errors.length === 0) {
      errHost.innerHTML = `<div class="empty" style="padding:32px 20px"><div class="empty__title">Sin errores</div></div>`;
    } else {
      errHost.innerHTML = errors.map(e => `
        <div class="file-row">
          <div class="file-row__icon is-danger">${Icon.alert}</div>
          <div class="file-row__body">
            <div class="file-row__title mono">${esc(e.key)}</div>
          </div>
          <div style="font-family:var(--mono);font-weight:700;color:var(--danger)">${e.count}</div>
        </div>
      `).join('');
    }

    // Endpoints
    const epHost = document.getElementById('logs-endpoints');
    const endpoints = metrics.errors?.topPaths || metrics.rateLimit?.topEndpoints || [];
    if (endpoints.length === 0) {
      epHost.innerHTML = `<div class="empty" style="padding:32px 20px"><div class="empty__title">Sin datos</div></div>`;
    } else {
      epHost.innerHTML = endpoints.map(e => `
        <div class="file-row">
          <div class="file-row__icon is-primary">${Icon.activity}</div>
          <div class="file-row__body">
            <div class="file-row__title mono">${esc(e.key)}</div>
          </div>
          <div style="font-family:var(--mono);font-weight:700;color:var(--primary)">${e.count}</div>
        </div>
      `).join('');
    }

    // Raw
    document.getElementById('logs-raw').textContent = JSON.stringify(raw, null, 2);
  } catch (e) {
    Toast.err('Error cargando logs', e.message);
  }
}

   ───────────────────────────────────────────────────────────────────── */
function startAutoRefresh() {
  stopAutoRefresh();
  state.autoRefreshTimer = setInterval(() => {
    if (state.currentRoute === 'dashboard') {
      const btn = document.getElementById('dash-refresh');
      if (btn) loadDashboard();
    }
  }, 30000);
}
function stopAutoRefresh() {
  if (state.autoRefreshTimer) {
    clearInterval(state.autoRefreshTimer);
    state.autoRefreshTimer = null;
  }
}

/* ─────────────────────────────────────────────────────────────────────
   SIDEBAR / MOBILE
   ───────────────────────────────────────────────────────────────────── */
function initSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const toggle = document.getElementById('menu-toggle');

  toggle?.addEventListener('click', () => {
    sidebar.classList.add('is-open');
    overlay.classList.add('is-open');
  });

  overlay?.addEventListener('click', () => {
    sidebar.classList.remove('is-open');
    overlay.classList.remove('is-open');
  });

  // Cerrar al navegar (mobile)
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      if (window.innerWidth <= 900) {
        sidebar.classList.remove('is-open');
        overlay.classList.remove('is-open');
      }
    });
  });
}

   ───────────────────────────────────────────────────────────────────── */
function renderRoute(route) {
  const view = Views[route] || Views.dashboard;
  const root = document.getElementById('view-root');

  // Sidebar active
  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.toggle('is-active', item.dataset.route === route);
  });

  // Topbar title
  document.getElementById('topbar-page').textContent = view.title || 'Dashboard';

  // Render
  state.currentRoute = route;
  try {
    view.render(root);
  } catch (e) {
    root.innerHTML = `
      <div class="view">

          <div class="card__body">
            <div class="empty">

}

async function initUser() {
  try {
    const data = await api('/api/auth/me');
    if (!data?.ok || !data.user) {
      location.href = '/login';
      return null;
    }
    if (String(data.user.role).toLowerCase() !== 'admin') {
      Toast.err('Sin permisos', 'Necesitás rol admin para acceder');
      setTimeout(() => location.href = '/chat', 1500);
      return null;
    }
    state.user = data.user;

    // Actualizar sidebar
    const name = data.user.name || data.user.email || 'Admin';
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-mail').textContent = data.user.email;
    document.getElementById('user-avatar').textContent = (name[0] || '?').toUpperCase();

    return data.user;
  } catch (e) {
    Toast.err('Error cargando usuario', e.message);
    return null;
  }
}

   THEME
   ───────────────────────────────────────────────────────────────────── */
function initTheme() {
  setTheme(getTheme());
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const current = document.documentElement.dataset.theme;
    const next = current === 'dark' ? 'light' : 'dark';
    setTheme(next);
    Toast.ok(next === 'dark' ? 'Modo oscuro' : 'Modo claro');
  });
}

/* ─────────────────────────────────────────────────────────────────────
   REFRESH
   ───────────────────────────────────────────────────────────────────── */
function initRefresh() {
  document.getElementById('refresh-btn').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    btn.classList.add('is-loading');
    renderRoute(state.currentRoute);
    setTimeout(() => btn.classList.remove('is-loading'), 600);
  });
}

/* ─────────────────────────────────────────────────────────────────────
   ALERTS
   ───────────────────────────────────────────────────────────────────── */
async function checkAlerts() {
  try {
    const [migrations, notifications] = await Promise.all([
      api('/api/admin/migrations').catch(() => null),
      api('/api/notifications/unread').catch(() => null),
    ]);

    // Migration badge
    if (migrations && migrations.pending > 0) {
      const badge = document.getElementById('badge-migrations');
      if (badge) {
        badge.textContent = migrations.pending;
        badge.style.background = 'var(--warning)';
        badge.style.color = '#fff';
      }
    }

    // Alerts dot
    const dot = document.getElementById('alerts-dot');
    if (dot) {
      const hasAlerts = (notifications?.unread > 0);
      dot.hidden = !hasAlerts;
    }
  } catch {}
}

/* ─────────────────────────────────────────────────────────────────────
   GLOBAL SEARCH
   ───────────────────────────────────────────────────────────────────── */
function initGlobalSearch() {
  const input = document.getElementById('global-search');
  if (!input) return;

  let timer = null;
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const q = input.value.trim();
      if (q.length >= 2) {
        Router.navigate('search');
        setTimeout(() => {
          const si = document.getElementById('search-input');
          if (si) {
            si.value = q;
            si.dispatchEvent(new Event('input'));
          }
        }, 100);
      }
    }
  });

  // Cmd/Ctrl + K
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      input.focus();
      input.select();
    }
  });
}

/* ─────────────────────────────────────────────────────────────────────
   LOGOUT
   ───────────────────────────────────────────────────────────────────── */
function initLogout() {
  document.getElementById('logout-btn').addEventListener('click', async () => {
    const ok = await Modal.confirm({
      title: 'Cerrar sesión',
      message: '¿Seguro que querés salir del panel de admin?',
      confirmLabel: 'Cerrar sesión',
    });
    if (!ok) return;
    try {
      await api('/api/auth/logout', { method: 'POST' });
    } catch {}
    location.href = '/login';
  });
}

/* ─────────────────────────────────────────────────────────────────────
   BOOT
   ───────────────────────────────────────────────────────────────────── */
async function boot() {
  initTheme();

  const user = await initUser();
  if (!user) return;

  initSidebar();
  initRefresh();
  initGlobalSearch();
  initLogout();

  Router.onRoute((route) => {
    renderRoute(route);
    checkAlerts();
  });

  // Auto-refresh
  if (localStorage.getItem('admin-auto-refresh') !== 'false') {
    startAutoRefresh();
  }

  // Chequear alertas cada 60s
  setInterval(checkAlerts, 60000);
  checkAlerts();

  console.log(
    '%cNumination · Admin%c  v1.0  ·  ' + (user.email || ''),
    'background:#7c5eff;color:#fff;padding:4px 10px;border-radius:4px;font-weight:700',
    'color:#8888a0'
  );
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot, { once: true });
} else {
  boot();
}

})();
</script>

</body>
</html>
