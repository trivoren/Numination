<!DOCTYPE html>
<html lang="es-CO" data-theme="gray">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Numination</title>
<meta name="supabase-publishable-key" content="sb_publishable_mrKTw0QGiuikjTb6SY0Hgg_Nak0QLk7" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/themes.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text-primary);
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,textarea,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

/* Top bar — home_screen */
.top{
  display:flex;
  align-items:center;
  gap:4px;
  padding:8px 10px;
  flex-shrink:0;
}
.icon-btn{
  width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  color:var(--text-primary);
  flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-alt)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-pill{
  flex:1;
  height:42px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 14px;
  border-radius:22px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-secondary);
  font-size:14.5px;
}
.search-pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Main scroll */
.scroll{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}

/* Empty state */
.empty{
  margin:auto;
  text-align:center;
  padding:24px 28px 12px;
  max-width:420px;
}
.empty h2{
  font-size:22px;
  font-weight:700;
  letter-spacing:-0.3px;
  color:var(--text-primary);
  margin-bottom:8px;
}
.empty p{
  font-size:14.5px;
  color:var(--text-secondary);
  line-height:1.45;
}

/* Chips */
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  padding:8px 16px 12px;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:10px 14px;
  border-radius:18px;
  border:1px solid var(--border);
  background:var(--surface);
  font-size:13.5px;
  color:var(--text-primary);
  white-space:nowrap;
}
.chip svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip:active{transform:scale(.98)}

/* Messages */
.msgs{padding:8px 14px 18px;display:flex;flex-direction:column;gap:10px}
.bubble-user{
  align-self:flex-end;
  max-width:88%;
  padding:12px 16px;
  border-radius:18px;
  background:color-mix(in srgb,var(--accent) 12%,var(--surface));
  border:1px solid color-mix(in srgb,var(--accent) 22%,var(--border));
  font-size:15px;
  line-height:1.45;
}
.bubble-ai{
  align-self:stretch;
  font-size:15px;
  line-height:1.6;
}
.bubble-ai pre{
  background:#0f0f10;color:#e8e8e8;
  padding:12px;border-radius:12px;
  overflow:auto;font-family:JetBrains Mono,monospace;font-size:12px;margin:8px 0;
}

/* Composer — bottom input bar Flutter */
.bottom{
  padding:6px 12px calc(10px + env(safe-area-inset-bottom));
  flex-shrink:0;
  background:var(--bg);
}
.composer{
  display:flex;
  align-items:flex-end;
  gap:6px;
  min-height:52px;
  padding:6px 6px 6px 8px;
  border-radius:28px;
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.composer .side{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  color:var(--text-secondary);
  flex-shrink:0;
}
.composer .side svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composer textarea{
  flex:1;
  border:none;outline:none;
  background:transparent;
  padding:10px 4px;
  min-height:40px;max-height:120px;
  resize:none;
  font-size:15px;
  line-height:1.4;
}
.composer textarea::placeholder{color:var(--text-secondary)}
.send{
  width:42px;height:42px;
  border-radius:50%;
  background:#1e88c7;
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.send:disabled{opacity:.35}
.send svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Drawer */
.backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,.35);
  z-index:40;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.backdrop.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;bottom:0;
  width:min(320px,88vw);
  background:#fff;
  z-index:50;
  transform:translateX(-105%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  box-shadow:4px 0 24px rgba(0,0,0,.08);
}
[data-theme="dark"] .drawer,
[data-theme="midnight"] .drawer{background:var(--surface)}
.drawer.open{transform:none}
.drawer-head{
  display:flex;align-items:center;gap:12px;
  padding:18px 16px 12px;
}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:var(--surface-alt);
  object-fit:cover;
  flex-shrink:0;
}
.avatar-fallback{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#1e88c7,#6ed7ff);
  color:#fff;font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.drawer-name{font-weight:700;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-nav{padding:4px 8px;flex:1;overflow:auto}
.nav-item{
  display:flex;align-items:center;gap:14px;
  padding:13px 12px;
  border-radius:12px;
  font-size:15.5px;
  color:var(--text-primary);
  width:100%;
  text-align:left;
}
.nav-item:hover{background:var(--surface-alt)}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-item .bal{margin-left:auto;color:#1e88c7;font-weight:600;font-size:14px}
.drawer-div{height:1px;background:var(--border);margin:10px 12px}
.sessions-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 12px 8px;
}
.sessions-head span{font-size:14px;font-weight:600;color:var(--text-primary)}
.filter-pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:6px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  font-size:13px;
  color:var(--text-primary);
}
.filter-pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.chat-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;
  border-radius:12px;
  width:100%;
  text-align:left;
  font-size:14.5px;
  color:var(--text-primary);
}
.chat-row:hover,.chat-row.active{background:var(--surface-alt)}
.chat-row svg{width:20px;height:20px;stroke:#1e88c7;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chat-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-fab{
  position:absolute;right:16px;bottom:20px;
  width:52px;height:52px;border-radius:50%;
  background:#1e88c7;color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(30,136,199,.35);
}
.drawer-fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;color:var(--text-secondary)}
.gate[hidden]{display:none!important}
</style>
</head>
<body>
<div class="gate" id="gate">Cargando…</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="avatar-fallback" id="avatar">K</div>
    <div class="drawer-name" id="uname">Usuario</div>
    <button type="button" class="icon-btn" id="logout" title="Salir" aria-label="Salir">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
  <nav class="drawer-nav">
    <a class="nav-item" href="/projects">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Proyectos
    </a>
    <a class="nav-item" href="/artifacts">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Artefactos
    </a>
    <a class="nav-item" href="/connectors">
      <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Conectores
    </a>
    <a class="nav-item" href="/notifications">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Notificaciones
    </a>
    <a class="nav-item" href="/credits">
      <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      Créditos
      <span class="bal" id="bal">—</span>
    </a>
    <div class="drawer-div"></div>
    <div class="sessions-head">
      <span>Sesiones</span>
      <button type="button" class="filter-pill">
        Chat
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    <div id="chat-list"></div>
  </nav>
  <button type="button" class="drawer-fab" id="new-chat" title="Nuevo chat" aria-label="Nuevo chat">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</aside>

<header class="top">
  <button type="button" class="icon-btn" id="menu" aria-label="Menú">
    <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <a class="search-pill" href="/search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Buscar chats
  </a>
  <a class="icon-btn" href="/ghost" aria-label="Ghost">
    <svg viewBox="0 0 24 24"><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/></svg>
  </a>
</header>

<div class="scroll" id="scroll">
  <div class="empty" id="empty">
    <h2>¿Qué vamos a resolver hoy?</h2>
    <p>Escribe una pregunta o empieza con una idea.</p>
  </div>
  <div class="msgs" id="msgs" hidden></div>
</div>

<div class="chips" id="chips">
  <button type="button" class="chip" data-prompt="Ayúdame a escribir código">
    <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    Escribir código
  </button>
  <button type="button" class="chip" data-prompt="Explícame un concepto de programación">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Explicar un concepto
  </button>
</div>

<footer class="bottom">
  <div class="composer">
    <button type="button" class="side" id="attach" aria-label="Adjuntar">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Resume este tema sin perder lo importante."></textarea>
    <button type="button" class="side" id="mic" aria-label="Voz">
      <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button type="button" class="send" id="send" disabled aria-label="Enviar">
      <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
(function () {
  try {
    var t = localStorage.getItem('numination-theme');
    document.documentElement.dataset.theme = t || 'gray';
  } catch (_) {
    document.documentElement.dataset.theme = 'gray';
  }
  try { localStorage.removeItem('numination-supabase-session'); } catch (_) {}

  var gate = document.getElementById('gate');
  var forced = setTimeout(function () {
    var tok = null;
    try { tok = localStorage.getItem('numination-api-token'); } catch (_) {}
    if (tok) gate.hidden = true;
    else location.replace('/login');
  }, 2500);

  function boot() {
    var Auth = window.NuminationAuth, Api = window.NuminationApi;
    if (!Auth || !Api) { location.replace('/login'); return; }
    Auth.getSession().then(function (session) {
      clearTimeout(forced);
      if (!session) { location.replace('/login'); return; }
      gate.hidden = true;
      startApp(session, Auth, Api);
    }).catch(function () {
      clearTimeout(forced);
      var tok = null;
      try { tok = localStorage.getItem('numination-api-token'); } catch (_) {}
      if (tok) { gate.hidden = true; startApp({ user: { email: 'usuario' } }, Auth, Api); }
      else location.replace('/login');
    });
  }

  function startApp(session, Auth, Api) {
    var email = (session.user && session.user.email) || 'Usuario';
    var name = email.split('@')[0];
    document.getElementById('uname').textContent = name;
    document.getElementById('avatar').textContent = (name[0] || 'U').toUpperCase();

    var state = { chats: [], active: null, messages: [], sending: false };
    var msgs = document.getElementById('msgs');
    var empty = document.getElementById('empty');
    var chips = document.getElementById('chips');
    var input = document.getElementById('input');
    var send = document.getElementById('send');

    function openDrawer(o) {
      document.getElementById('drawer').classList.toggle('open', o);
      document.getElementById('backdrop').classList.toggle('open', o);
    }
    document.getElementById('menu').onclick = function () { openDrawer(true); };
    document.getElementById('backdrop').onclick = function () { openDrawer(false); };
    document.getElementById('logout').onclick = function () {
      Auth.signOut().finally(function () { location.replace('/login'); });
    };

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
    function md(t) {
      return esc(t)
        .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
    }
    function renderMsgs() {
      if (!state.messages.length) {
        empty.hidden = false; chips.hidden = false; msgs.hidden = true; msgs.innerHTML = '';
        return;
      }
      empty.hidden = true; chips.hidden = true; msgs.hidden = false;
      msgs.innerHTML = state.messages.map(function (m) {
        return m.fromUser
          ? '<div class="bubble-user">' + esc(m.text) + '</div>'
          : '<div class="bubble-ai">' + md(m.text) + '</div>';
      }).join('');
      document.getElementById('scroll').scrollTop = 1e9;
    }
    function renderChats() {
      var icon = '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
      document.getElementById('chat-list').innerHTML = state.chats.map(function (c) {
        var title = c.title || c.name || 'Chat';
        return '<button type="button" class="chat-row' + (c.id === state.active ? ' active' : '') + '" data-id="' + c.id + '">' + icon + '<span>' + esc(title) + '</span></button>';
      }).join('');
      document.querySelectorAll('#chat-list [data-id]').forEach(function (b) {
        b.onclick = function () { openChat(b.getAttribute('data-id')); };
      });
    }
    function loadChats() {
      return Api.listChats().then(function (d) {
        state.chats = Array.isArray(d) ? d : (d.chats || []);
        renderChats();
      }).catch(function () { state.chats = []; renderChats(); });
    }
    function loadCredits() {
      return Api.credits().then(function (c) {
        document.getElementById('bal').textContent = String(c.balance != null ? c.balance : '—');
      }).catch(function () {});
    }
    function openChat(id) {
      state.active = id; state.messages = []; renderMsgs(); renderChats(); openDrawer(false);
      Api.getMessages(id).then(function (d) {
        var list = Array.isArray(d) ? d : (d.messages || []);
        state.messages = list.map(function (m) {
          return { text: m.content || m.text || '', fromUser: m.role === 'user' || m.fromUser === true };
        });
        renderMsgs();
      }).catch(function () {});
    }
    document.getElementById('new-chat').onclick = function () {
      state.active = null; state.messages = []; renderMsgs(); renderChats(); openDrawer(false);
    };

    document.querySelectorAll('.chip').forEach(function (c) {
      c.onclick = function () {
        input.value = c.getAttribute('data-prompt') || c.textContent.trim();
        updateSend();
        input.focus();
      };
    });

    function updateSend() { send.disabled = !input.value.trim() || state.sending; }
    input.oninput = function () {
      updateSend();
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    };
    input.onkeydown = function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
    };
    send.onclick = go;

    async function go() {
      var text = input.value.trim();
      if (!text || state.sending) return;
      state.messages.push({ text: text, fromUser: true });
      input.value = ''; input.style.height = 'auto'; updateSend();
      state.sending = true; renderMsgs();
      try {
        if (!state.active) {
          var created = await Api.createChat({});
          state.active = created.id || created.chatId;
          await loadChats();
        }
        try { await Api.saveMessage(state.active, { role: 'user', content: text }); } catch (_) {}
        state.messages.push({ text: '', fromUser: false });
        var idx = state.messages.length - 1;
        var out = '';
        try {
          for await (var ev of Api.chatStream({ chatId: state.active, message: text, mode: 'chat' })) {
            var d = ev.data || {};
            var chunk = d.delta || d.content || d.text || d.token || '';
            if (chunk) { out += chunk; state.messages[idx].text = out; renderMsgs(); }
          }
        } catch (_) {}
        if (!out) {
          var res = await Api.chat({ chatId: state.active, message: text, mode: 'chat' });
          state.messages[idx].text = res.content || res.message || res.reply || 'Sin respuesta';
        }
      } catch (e) {
        state.messages.push({ text: (e && e.message) || 'Error', fromUser: false });
      } finally {
        state.sending = false; renderMsgs(); updateSend(); loadCredits(); loadChats();
      }
    }

    var qid = new URLSearchParams(location.search).get('id');
    Promise.all([loadChats(), loadCredits()]).then(function () {
      if (qid) openChat(qid);
      renderMsgs(); updateSend();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
