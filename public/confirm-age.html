<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F9F8" />
<title>Confirmar edad · Numination</title>
<meta name="supabase-publishable-key" content="sb_publishable_mrKTw0QGiuikjTb6SY0Hgg_Nak0QLk7" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#F7F9F8;--navy:#16325C;--ink:#111;--muted:#8A8A8A;--line:#D4D4D4;--error:#C23B3B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px}
.wrap{width:100%;max-width:400px}
h1{font-size:32px;font-weight:800;text-align:center;letter-spacing:-.6px;line-height:1.12;margin-bottom:12px}
.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.4;margin-bottom:36px}
.check{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px 16px 16px;
  background:#fff;border:1px solid var(--line);border-radius:20px;
  cursor:pointer;user-select:none;margin-bottom:16px;
}
.check.on{border-color:var(--navy);border-width:1.6px}
.box{
  width:24px;height:24px;border-radius:8px;flex-shrink:0;
  border:1.4px solid #B8B8B8;background:#fff;
  display:flex;align-items:center;justify-content:center;
}
.check.on .box{background:var(--navy);border-color:var(--navy)}
.box svg{display:none;width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round}
.check.on .box svg{display:block}
.check span{font-size:15px;font-weight:600;line-height:1.3}
.err{color:var(--error);font-size:13px;margin-bottom:10px;min-height:18px}
.btn{
  width:100%;height:50px;border:none;border-radius:28px;
  background:var(--navy);color:#fff;font-weight:600;font-size:15px;cursor:pointer;
}
.btn:disabled{opacity:.28;cursor:not-allowed}
.link{display:block;text-align:center;margin-top:28px;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer;background:none;border:none;font:inherit}
.banned h1{margin-bottom:14px}
.banned .sub{margin-bottom:36px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="confirm-view">
  <h1>Confirm you're<br/>14 or older.</h1>
  <p class="sub">Si eres menor de 14 años no puedes entrar<br/>y tu cuenta será baneada.</p>
  <div class="check" id="check" role="checkbox" aria-checked="false" tabindex="0">
    <div class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    <span>Confirmo que tengo 14 años o más</span>
  </div>
  <p class="err" id="err"></p>
  <button type="button" class="btn" id="continue" disabled>Continuar  →</button>
  <button type="button" class="link" id="underage">Tengo menos de 14 años</button>
</div>
<div class="wrap banned" id="banned-view" hidden>
  <h1>Account<br/>blocked.</h1>
  <p class="sub">Esta cuenta está baneada porque se declaró<br/>menor de 14 años. Numination no está<br/>disponible para ti.</p>
  <button type="button" class="btn" id="banned-out">Salir</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
(function(){
  var Auth=window.NuminationAuth, Api=window.NuminationApi;
  var confirmed=false;
  var check=document.getElementById('check');
  var btn=document.getElementById('continue');
  var err=document.getElementById('err');

  function isAgeConfirmed(user){
    var m=(user&&user.user_metadata)||(user&&user.userMetadata)||{};
    return m.age_14_plus===true || m.age_14_plus==='true';
  }
  function isBanned(user){
    var m=(user&&user.user_metadata)||(user&&user.userMetadata)||{};
    return m.banned_underage===true || m.banned_underage==='true';
  }

  Auth.getSession().then(function(session){
    if(!session){location.replace('/login');return;}
    var user=session.user;
    if(isBanned(user)){
      document.getElementById('confirm-view').hidden=true;
      document.getElementById('banned-view').hidden=false;
      return;
    }
    if(isAgeConfirmed(user)){
      location.replace('/chat');
      return;
    }
  }).catch(function(){location.replace('/login');});

  function toggle(){
    confirmed=!confirmed;
    check.classList.toggle('on',confirmed);
    check.setAttribute('aria-checked',confirmed?'true':'false');
    btn.disabled=!confirmed;
  }
  check.onclick=toggle;
  check.onkeydown=function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}};

  btn.onclick=async function(){
    if(!confirmed)return;
    btn.disabled=true;err.textContent='';
    try{
      // Mismo endpoint que Flutter: POST /auth/age
      await Api.request('POST','/auth/age',{confirmed14Plus:true});
      // Actualizar metadata local de Supabase
      try{
        var client=Auth.getClient();
        await client.auth.updateUser({data:{age_14_plus:true,banned_underage:false,numination_email_pending:false}});
      }catch(_){}
      location.replace('/chat');
    }catch(e){
      err.textContent=(e&&e.message)||'No se pudo confirmar la edad';
      btn.disabled=false;
    }
  };

  document.getElementById('underage').onclick=async function(){
    if(!confirm('Numination es solo para mayores de 14 años. Si continúas, esta cuenta quedará baneada.'))return;
    try{
      try{await Api.request('POST','/auth/age',{confirmedUnder14:true});}catch(_){}
    }finally{
      await Auth.signOut();
      location.replace('/login');
    }
  };

  document.getElementById('banned-out').onclick=async function(){
    await Auth.signOut();
    location.replace('/login');
  };
})();
</script>
</body>
</html>
