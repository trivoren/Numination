<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F9F8" />
<title>Welcome · Numination</title>
<meta name="supabase-publishable-key" content="sb_publishable_mrKTw0QGiuikjTb6SY0Hgg_Nak0QLk7" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#F7F9F8;--navy:#16325C;--ink:#111;--muted:#8A8A8A;--line:#D4D4D4;--white:#fff;--error:#C23B3B;--focus:#9AA7BC}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px}
.view{width:100%;max-width:400px}.view[hidden]{display:none}
h1{font-size:32px;font-weight:800;text-align:center;margin-bottom:44px;letter-spacing:-.6px;line-height:1.12}
.field{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 16px;background:#fff;border:1px solid var(--line);border-radius:28px}
.field:focus-within{border-color:var(--focus)}
.field svg{width:20px;height:20px;color:var(--muted);flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.field input{flex:1;border:none;outline:none;font:inherit;padding:16px 0;background:transparent;font-size:15px}
.field input::placeholder{color:var(--muted)}
.btn{width:100%;height:50px;margin-top:16px;border:none;border-radius:28px;background:var(--navy);color:#fff;font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.7}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.err{color:var(--error);font-size:13px;margin-top:8px;min-height:18px}
.socials{display:flex;justify-content:center;gap:12px;margin-top:40px}
.social{width:52px;height:52px;border-radius:14px;border:1px solid #E2E2E2;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.footer{text-align:center;margin-top:28px;color:var(--muted);font-size:14px}
.footer button{background:none;border:none;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;color:var(--ink)}
.back{width:40px;height:40px;border:none;background:none;font-size:20px;cursor:pointer;margin-bottom:12px}
.sub{color:var(--muted);font-size:14px;margin-bottom:24px}
h2{font-size:26px;font-weight:800;margin-bottom:8px}
</style>
</head>
<body>
<div class="view" id="entry">
  <h1>Welcome to<br/>Numination.</h1>
  <form id="form-entry">
    <label class="field">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <input type="email" id="entry-email" placeholder="Correo electrónico" autocomplete="email" />
    </label>
    <p class="err" id="entry-error"></p>
    <button class="btn" type="submit">Continuar <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
  </form>
  <div class="socials">
    <button type="button" class="social" id="btn-google" title="Google">
      <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    </button>
    <button type="button" class="social" id="btn-github" title="GitHub">
      <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#0a0a0a" d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
    </button>
  </div>
  <p class="footer">Don't have an account? <button type="button" id="btn-signup">Sign up</button></p>
</div>
<div class="view" id="password" hidden>
  <button type="button" class="back" id="back-pw">←</button>
  <h2>Ingresa tu contraseña</h2>
  <p class="sub" id="pw-email"></p>
  <form id="form-pw">
    <label class="field"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="pw-input" placeholder="Contraseña" autocomplete="current-password" /></label>
    <p class="err" id="pw-error"></p>
    <button class="btn" type="submit" id="btn-login">Entrar</button>
  </form>
</div>
<div class="view" id="signup" hidden>
  <button type="button" class="back" id="back-su">←</button>
  <h2>Crear cuenta</h2>
  <p class="sub">Correo y contraseña segura.</p>
  <form id="form-su">
    <label class="field" style="margin-bottom:12px"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input type="email" id="su-email" placeholder="Correo" autocomplete="email" /></label>
    <label class="field"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="su-pw" placeholder="Contraseña" autocomplete="new-password" /></label>
    <p class="err" id="su-error"></p>
    <button class="btn" type="submit">Crear cuenta</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
(function(){
  try{localStorage.removeItem('numination-supabase-session');}catch(_){}
  var Auth=window.NuminationAuth;
  var $=function(id){return document.getElementById(id);};
  function show(name){['entry','password','signup'].forEach(function(v){$(v).hidden=v!==name;});}
  function isEmail(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||'').trim());}
  function msg(e){
    var m=(e&&e.message)||'';
    if(/invalid api key/i.test(m)) return 'API key inválida';
    if(/invalid login|invalid_credentials/i.test(m)) return 'Correo o contraseña incorrectos';
    if(/email not confirmed/i.test(m)) return 'Confirma tu correo primero';
    return m||'Error';
  }
  var pending='';
  // Si ya hay sesión → mismo routing que Flutter (edad / chat)
  if(Auth){
    Auth.getSession().then(function(s){
      if(s) Auth.routeAfterAuth(s);
    }).catch(function(){});
  }
  $('form-entry').onsubmit=function(e){
    e.preventDefault();
    var email=$('entry-email').value.trim();
    if(!isEmail(email)){$('entry-error').textContent='Ingresa un correo válido';return;}
    $('entry-error').textContent='';pending=email;$('pw-email').textContent=email;$('pw-input').value='';$('pw-error').textContent='';show('password');$('pw-input').focus();
  };
  $('back-pw').onclick=function(){show('entry');};
  $('back-su').onclick=function(){show('entry');};
  $('btn-signup').onclick=function(){$('su-error').textContent='';show('signup');};
  $('form-pw').onsubmit=async function(e){
    e.preventDefault();
    var btn=$('btn-login');btn.disabled=true;
    try{
      var session=await Auth.signInWithPassword(pending,$('pw-input').value);
      Auth.routeAfterAuth(session);
    }catch(ex){$('pw-error').textContent=msg(ex);btn.disabled=false;}
  };
  $('form-su').onsubmit=async function(e){
    e.preventDefault();
    var email=$('su-email').value.trim(),pw=$('su-pw').value;
    if(!isEmail(email)){$('su-error').textContent='Correo inválido';return;}
    if(!pw||pw.length<6){$('su-error').textContent='Mínimo 6 caracteres';return;}
    try{
      var session=await Auth.signUp(email,pw);
      // Si el signup devuelve sesión (email autoconfirm), respeta edad; si no, pide verificar correo
      if(session&&session.user){
        Auth.routeAfterAuth(session);
      }else{
        $('su-error').textContent='Revisa tu correo para confirmar';
        setTimeout(function(){show('entry');},1500);
      }
    }catch(ex){$('su-error').textContent=msg(ex);}
  };
  $('btn-google').onclick=async function(){try{await Auth.signInWithOAuth('google');}catch(ex){$('entry-error').textContent=msg(ex);}};
  $('btn-github').onclick=async function(){try{await Auth.signInWithOAuth('github');}catch(ex){$('entry-error').textContent=msg(ex);}};
})();
</script>
</body>
</html>
