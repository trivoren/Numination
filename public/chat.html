<!DOCTYPE html>
<html lang="es-CO" data-theme="blanco">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Numination</title>
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script>
(function(){try{var s=localStorage.getItem('numination-theme');document.documentElement.dataset.theme=s||'blanco';}catch(e){}})();
</script>
<style>
/* =========================================================
   PALETTE (mirrors AppPalette — same keys used in home_screen)
   ========================================================= */
:root{
  --bg:#ffffff;
  --surface:#f5f6f8;
  --surface-alt:#eef0f3;
  --text-primary:#050505;
  --text-secondary:#65676b;
  --accent:#1877f2;
  --border:#e4e6eb;

  --danger:#ef4444;
  --danger-soft:#fef2f2;

  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-2xl:24px; --r-pill:999px;
  --font:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --t-fast:140ms cubic-bezier(.4,0,.2,1);
  --t-base:220ms cubic-bezier(.4,0,.2,1);
  --t-slow:340ms cubic-bezier(.16,1,.3,1);
}
[data-theme="medianoche"]{
  --bg:#0f1116; --surface:#181b22; --surface-alt:#20242d;
  --text-primary:#f0f2f5; --text-secondary:#8b919b;
  --accent:#4090ff; --border:#2a2f3a;
}
[data-theme="oscuro"]{
  --bg:#0a0a0c; --surface:#141416; --surface-alt:#1e1e22;
  --text-primary:#f0f0f5; --text-secondary:#8e8e98;
  --accent:#4090ff; --border:#26262c;
}
[data-theme="gris"]{
  --bg:#f0f1f3; --surface:#e8eaed; --surface-alt:#dde0e5;
  --text-primary:#050505; --text-secondary:#65676b;
  --accent:#1877f2; --border:#d2d6dd;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%}
body{
  font-family:var(--font);
  background:var(--bg);color:var(--text-primary);
  font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,textarea{font-family:inherit;color:inherit;background:none;border:none;outline:none}
textarea{resize:none;overflow-y:auto}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
::selection{background:rgba(24,119,242,.20);color:var(--text-primary)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* =========================================================
   APP · Column(mainAxisSize:max) — TopBar · Expanded · Bottom
   ========================================================= */
.app{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;width:100vw;
  background:var(--bg);
}

/* =========================================================
   _TopBar
   ========================================================= */
.topbar{
  display:flex;
  align-items:center;
  padding:10px 12px 8px;
  flex-shrink:0;
  background:var(--bg);
}
.topbar__menu-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
  cursor:pointer;
  border-radius:50%;
  transition:background var(--t-fast);
}
.topbar__menu-wrap:hover{background:var(--surface-alt)}
.topbar__menu-wrap svg{
  width:26px;height:26px;
  fill:none;stroke:rgba(5,5,5,.88);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.topbar__gap4{width:4px;flex-shrink:0}
.topbar__search{
  flex:1;
  display:flex;
  align-items:center;
  gap:10px;
  height:42px;
  padding:0 14px;
  background:var(--surface);
  border-radius:22px;
  cursor:pointer;
  min-width:0;
  transition:background var(--t-fast);
}
.topbar__search:hover{background:var(--surface-alt)}
.topbar__search svg{
  width:20px;height:20px;flex-shrink:0;
  fill:none;stroke:var(--text-secondary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.topbar__search-text{
  flex:1;min-width:0;
  font-size:15px;font-weight:400;
  color:var(--text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar__ghost-wrap{
  display:flex;align-items:center;justify-content:center;
  padding:8px;
  cursor:pointer;
  border-radius:50%;
  transition:background var(--t-fast);
}
.topbar__ghost-wrap:hover{background:var(--surface-alt)}
.topbar__ghost-wrap svg{
  width:24px;height:24px;
  fill:none;stroke:rgba(5,5,5,.80);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}

/* =========================================================
   Expanded → Scroll (ListView)
   ========================================================= */
.scroll{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;
  scroll-behavior:smooth;
}
.scroll[hidden]{display:none}

/* =========================================================
   _EmptyState
   ========================================================= */
.empty{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 28px;
}
.empty[hidden]{display:none}
.empty__icon{
  width:70px;height:70px;
  border-radius:22px;
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
}
.empty__icon svg{
  width:34px;height:34px;
  fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.empty__gap20{height:20px}
.empty__title{
  font-size:21px;font-weight:700;
  color:var(--text-primary);
  text-align:center;
  letter-spacing:-.02em;
  line-height:1.25;
}
.empty__gap8{height:8px}
.empty__sub{
  font-size:14px;
  color:var(--text-secondary);
  text-align:center;
  line-height:1.4;
}

/* =========================================================
   ListView.builder — padding (0, 8, 0, 18)
   ========================================================= */
.messages{
  padding:8px 0 18px;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.messages[hidden]{display:none}

/* =========================================================
   _MessageBubble
   ========================================================= */
.message{
  display:flex;
  margin:5px 0;
  animation:msgIn .28s cubic-bezier(.16,1,.3,1);
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
.message--user{
  justify-content:flex-end;
  margin-left:0;
  margin-right:0;
}
.message--assistant{
  justify-content:flex-start;
  margin-left:12px;
  margin-right:12px;
}
.message__col{
  display:flex;flex-direction:column;
  min-width:0;
  max-width:88%;
}
.message--assistant .message__col{max-width:94%}
.message--user .message__col{align-items:flex-end;max-width:88%}

/* Memory saved */
.memory-saved{
  width:100%;
  margin-bottom:10px;
  padding:11px 13px;
  background:rgba(5,5,5,.04);
  border:1px solid rgba(5,5,5,.18);
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:10px;
}
.memory-saved__icon{
  width:32px;height:32px;
  border-radius:9px;
  background:rgba(24,119,242,.12);
  color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.memory-saved__icon svg{
  width:17px;height:17px;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.memory-saved__body{
  flex:1;min-width:0;
}
.memory-saved__title{
  font-size:12px;font-weight:700;
  color:var(--text-primary);
  line-height:1.2;
}
.memory-saved__gap2{height:2px}
.memory-saved__sub{
  font-size:12px;
  color:var(--text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* Image (assistant, when imageUrl is present) */
.message__image-wrap{
  border-radius:16px;
  overflow:hidden;
  background:var(--surface);
  max-width:min(82vw, 420px);
  margin:0 auto;
}
.message__image-wrap img{
  width:100%;height:auto;display:block;
}

/* User bubble */
.message__bubble-user{
  padding:12px 16px;
  background:rgba(24,119,242,.14);
  border:1px solid rgba(24,119,242,.25);
  border-radius:18px;
  color:var(--text-primary);
  font-size:15px;
  line-height:1.45;
  word-wrap:break-word;
  overflow-wrap:break-word;
}

/* Assistant text (AiResponse) — no bubble */
.message__assistant-pad{
  padding:6px 4px;
  color:var(--text-primary);
  font-size:15px;
  line-height:1.65;
  word-wrap:break-word;
  overflow-wrap:break-word;
  width:100%;
  min-width:0;
}
.message__assistant-pad p{margin:0 0 12px}
.message__assistant-pad p:last-child{margin-bottom:0}
.message__assistant-pad strong{font-weight:700}
.message__assistant-pad em{font-style:italic;color:var(--text-secondary)}
.message__assistant-pad h2,.message__assistant-pad h3,.message__assistant-pad h4{
  margin:20px 0 10px;font-weight:700;line-height:1.3;letter-spacing:-.02em;
}
.message__assistant-pad h2{font-size:20px}
.message__assistant-pad h3{font-size:17px}
.message__assistant-pad h4{font-size:15.5px}
.message__assistant-pad blockquote{
  border-left:3px solid var(--accent);
  padding-left:14px;margin:12px 0;
  color:var(--text-secondary);font-style:italic;
}
.message__assistant-pad ul,.message__assistant-pad ol{padding-left:22px;margin:10px 0}
.message__assistant-pad li{margin:4px 0}
.message__assistant-pad a{
  color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-weight:500;
}
.message__assistant-pad code{
  font-family:var(--font-mono);
  background:var(--surface-alt);
  border:1px solid var(--border);
  padding:2px 6px;
  border-radius:5px;
  font-size:13px;
  color:var(--accent);
}
.message__assistant-pad pre{
  background:#0f0f10;
  border:1px solid #1c1c20;
  border-radius:12px;
  overflow:hidden;
  margin:12px 0;
}
.message__assistant-pad pre code{
  background:none;border:none;padding:14px 16px;
  color:#e6e6e6;display:block;overflow-x:auto;
  white-space:pre;line-height:1.6;font-size:12.5px;
}
/* User bubble code */
.message__bubble-user code{
  font-family:var(--font-mono);
  background:rgba(5,5,5,.08);
  padding:2px 5px;border-radius:4px;
  font-size:13px;
}
.message__bubble-user pre{
  background:#0f0f10;border-radius:8px;overflow:hidden;margin:8px 0;
}
.message__bubble-user pre code{
  background:none;padding:12px 14px;color:#e6e6e6;display:block;
  overflow-x:auto;white-space:pre;font-size:12.5px;
}

/* Code block header with copy button */
.md-pre-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;background:#000;
  border-bottom:1px solid #1c1c20;
  font-size:11px;color:#a0a0a3;
  font-family:var(--font-mono);
}
.md-pre-copy{
  padding:3px 8px;border-radius:5px;
  font-size:11px;font-weight:600;
  color:#a0a0a3;font-family:var(--font);
  transition:all var(--t-fast);
  cursor:pointer;
}
.md-pre-copy:hover{color:#fff;background:rgba(255,255,255,.10)}
.md-pre-copy.is-copied{color:#4dff88}

/* Message action row — Row(min) with IconButton compact 17px */
.message__actions{
  display:flex;
  align-items:center;
  margin-top:0;
  min-height:0;
}
.message__action{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;
  padding:0;
  border-radius:50%;
  color:var(--text-secondary);
  transition:background var(--t-fast),color var(--t-fast);
  position:relative;
  cursor:pointer;
}
.message__action:hover{background:var(--surface-alt);color:var(--text-primary)}
.message__action svg{
  width:17px;height:17px;
  fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.message__action[data-tip]:hover::after{
  content:attr(data-tip);
  position:absolute;
  bottom:calc(100% + 6px);
  left:50%;
  transform:translateX(-50%);
  background:#333;color:#fff;
  font-size:11px;font-weight:500;
  padding:4px 8px;border-radius:6px;
  white-space:nowrap;pointer-events:none;
  z-index:10;
}

/* =========================================================
   _ThinkingMessage
   ========================================================= */
.thinking{
  display:flex;
  align-items:center;
  padding:12px 18px 18px;
}
.thinking__dot{
  width:7px;height:7px;
  margin:0 3px;
  border-radius:50%;
  background:var(--text-primary);
  animation:thinkingDot 900ms ease-in-out infinite;
  will-change:transform,opacity;
}
.thinking__dot:nth-child(2){animation-delay:150ms}
.thinking__dot:nth-child(3){animation-delay:300ms}
@keyframes thinkingDot{
  0%,100%{opacity:.35;transform:translateY(0)}
  33%{opacity:1;transform:translateY(-3px)}
  66%{opacity:.35;transform:translateY(0)}
}

/* Streaming cursor (when live) */
.stream-cursor{
  display:inline-block;
  width:7px;height:15px;
  background:var(--accent);
  margin-left:2px;vertical-align:-2px;
  border-radius:1px;
  animation:blink 1s infinite;
}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* =========================================================
   _BottomInputBar
   ========================================================= */
.bottom{
  flex-shrink:0;
  padding:4px 12px 12px;
  background:var(--bg);
}
.bottom[hidden]{display:none}

.prompt-starters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  height:40px;
  margin-bottom:10px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  padding:0;
}
.prompt-starters::-webkit-scrollbar{display:none}
.prompt-starters[hidden]{display:none}
/* ActionChip — pill with avatar icon (16) + label */
.prompt-chip{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;
  padding:0 12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  font-size:13.5px;font-weight:500;
  color:var(--text-primary);
  white-space:nowrap;
  flex-shrink:0;
  cursor:pointer;
  transition:background var(--t-fast),border-color var(--t-fast);
}
.prompt-chip:hover{background:var(--surface-alt);border-color:var(--text-secondary)}
.prompt-chip svg{
  width:16px;height:16px;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

.composer{
  display:flex;
  flex-direction:column;
  padding:5px 5px 5px 8px;
  background:var(--surface);
  border:1px solid rgba(101,103,107,.16);
  border-radius:24px;
  box-shadow:0 4px 12px rgba(0,0,0,.045);
  transition:border-color var(--t-base), box-shadow var(--t-base);
}
.composer.has-tools-open{
  border-color:rgba(24,119,242,.38);
}
.composer.is-listening{
  box-shadow:0 4px 20px rgba(0,0,0,.10);
}

/* Pending attachments */
.composer__attachments{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  padding:6px 5px 8px;
}
.composer__attachments:empty{display:none}
.attachment-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  height:32px;
  padding:0 8px 0 10px;
  background:var(--surface-alt);
  border:1px solid var(--border);
  border-radius:8px;
  font-size:13px;
  color:var(--text-primary);
  max-width:220px;
}
.attachment-chip svg{
  width:14px;height:14px;flex-shrink:0;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.attachment-chip__name{
  flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.attachment-chip__del{
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  color:var(--text-secondary);
  flex-shrink:0;
  cursor:pointer;
  transition:background var(--t-fast);
}
.attachment-chip__del:hover{background:var(--border);color:var(--text-primary)}
.attachment-chip__del svg{width:12px;height:12px;stroke-width:2.2}

/* Tools header — HERRAMIENTAS + line, or active tool icon + line */
.composer__tools-head{
  display:flex;
  align-items:center;
  padding:5px 5px 8px 7px;
  gap:12px;
}
.composer__tools-head-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:var(--accent);
  flex-shrink:0;
}
.composer__tools-head-icon{
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(24,119,242,.13);
  border:1px solid rgba(24,119,242,.65);
  box-shadow:0 0 10px rgba(24,119,242,.12);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
  flex-shrink:0;
}
.composer__tools-head-icon svg{
  width:17px;height:17px;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.composer__tools-head-line{
  flex:1;
  height:1px;
  background:rgba(101,103,107,.22);
}

/* Tools panel (expanded) */
.composer__tools-panel{
  padding:0 4px 10px;
  display:flex;
  flex-direction:column;
  gap:0;
}
.composer__tools-panel[hidden]{display:none}
.composer__tools-grid{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}
/* toolButton — 44×44 circle, surfaceAlt bg, border textSecondary@18%, selected accent@15% + accent@80% border + shadow */
.tool-btn{
  width:44px;height:44px;
  border-radius:50%;
  background:var(--surface-alt);
  border:1px solid rgba(101,103,107,.18);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
  transition:background 180ms cubic-bezier(.33,1,.68,1),
             border-color 180ms cubic-bezier(.33,1,.68,1),
             color 180ms cubic-bezier(.33,1,.68,1),
             box-shadow 180ms cubic-bezier(.33,1,.68,1);
  cursor:pointer;
  position:relative;
}
.tool-btn:hover{background:var(--surface)}
.tool-btn.is-active{
  background:rgba(24,119,242,.15);
  border-color:rgba(24,119,242,.80);
  color:var(--accent);
  box-shadow:0 0 12px rgba(24,119,242,.17);
}
.tool-btn svg{
  width:19px;height:19px;
  fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.tool-btn[data-tip]:hover::after{
  content:attr(data-tip);
  position:absolute;
  bottom:calc(100% + 6px);
  left:50%;transform:translateX(-50%);
  background:#333;color:#fff;
  font-size:11px;font-weight:500;
  padding:4px 8px;border-radius:6px;
  white-space:nowrap;pointer-events:none;
  z-index:10;
}

/* Modes */
.composer__modes{
  display:flex;
  flex-direction:column;
  gap:7px;
  padding-top:12px;
}
.composer__modes-label{
  font-size:10px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;
  color:var(--text-secondary);
}
.composer__modes-row{
  display:flex;gap:6px;flex-wrap:wrap;
}
/* _ModeChip — padding h:14 v:7, radius:16, active: surfaceAlt; inactive: surface@60% */
.mode-chip{
  padding:7px 14px;
  border-radius:16px;
  background:rgba(245,246,248,.6);
  font-size:13px;font-weight:600;
  color:var(--text-secondary);
  transition:background 180ms cubic-bezier(.33,1,.68,1),
             color 180ms cubic-bezier(.33,1,.68,1);
  cursor:pointer;
}
.mode-chip:hover{color:var(--text-primary)}
.mode-chip.is-active{
  background:var(--surface-alt);
  color:var(--text-primary);
}

/* Main row: plus(42×44) · field(expanded, pad 3,9,3,11) · mic · send(44×44 r:13) */
.composer__row{
  display:flex;
  align-items:flex-end;
  min-height:44px;
}
.composer__plus{
  width:42px;height:44px;
  padding:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
  transition:color var(--t-fast);
  cursor:pointer;
  flex-shrink:0;
}
.composer__plus:hover{color:var(--text-primary)}
.composer__plus svg{
  width:24px;height:24px;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  transition:transform 220ms cubic-bezier(.33,1,.68,1);
}
.composer__plus.is-open svg{transform:rotate(45deg);color:var(--accent)}
.composer__input-wrap{
  flex:1;
  min-width:0;
  padding:9px 3px 11px;
}
.composer__input{
  width:100%;
  min-height:20px;max-height:130px;
  font-size:15px;
  font-weight:400;
  line-height:1.35;
  color:var(--text-primary);
  resize:none;
  overflow-y:auto;
}
.composer__input::placeholder{
  color:rgba(101,103,107,.76);
}
.composer__mic-wrap{
  padding-bottom:2px;
  flex-shrink:0;
}
.composer__mic{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  color:var(--text-secondary);
  transition:background var(--t-fast),color var(--t-fast);
  cursor:pointer;
}
.composer__mic:hover{background:var(--surface-alt)}
.composer__mic.is-listening{color:var(--accent)}
.composer__mic svg{
  width:22px;height:22px;
  fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.composer__gap3{width:3px;flex-shrink:0}
.composer__send-wrap{
  padding-bottom:2px;
  flex-shrink:0;
}
/* IconButton.filled — 44×44 radius:13 accent, icon size 20 */
.composer__send{
  width:44px;height:44px;
  border-radius:13px;
  background:var(--accent);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--t-fast),transform var(--t-fast),opacity var(--t-fast);
  cursor:pointer;
}
.composer__send:not(:disabled):hover{background:#166fe5}
.composer__send:not(:disabled):active{transform:scale(.96)}
.composer__send:disabled{
  background:var(--surface-alt);
  color:rgba(101,103,107,.5);
  cursor:not-allowed;
}
.composer__send svg{
  width:20px;height:20px;
  fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}

/* =========================================================
   AppDrawer (drawer widget — slide-in from left)
   ========================================================= */
.drawer-scrim{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  z-index:180;
  opacity:0;visibility:hidden;
  transition:opacity 250ms cubic-bezier(.4,0,.2,1),visibility 250ms cubic-bezier(.4,0,.2,1);
}
.drawer-scrim.is-open{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;left:0;bottom:0;
  width:min(304px, 86vw);
  background:var(--surface);
  z-index:190;
  transform:translateX(-100%);
  transition:transform 340ms cubic-bezier(.16,1,.3,1);
  display:flex;
  flex-direction:column;
  box-shadow:4px 0 24px rgba(0,0,0,.10);
  overflow:hidden;
}
.drawer.is-open{transform:translateX(0)}

/* Drawer header: avatar + email + settings */
.drawer__head{
  display:flex;
  align-items:center;
  gap:12px;
  padding:20px 16px 14px;
  flex-shrink:0;
}
.drawer__avatar{
  width:44px;height:44px;
  border-radius:50%;
  background:rgba(24,119,242,.14);
  color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;
  overflow:hidden;
  flex-shrink:0;
}
.drawer__avatar img{width:100%;height:100%;object-fit:cover}
.drawer__user-info{flex:1;min-width:0}
.drawer__user-name{
  font-size:15px;font-weight:700;
  color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.25;
}
.drawer__user-email{
  font-size:12px;color:var(--text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px;
}
.drawer__settings-btn{
  width:38px;height:38px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
  transition:background var(--t-fast),color var(--t-fast);
  flex-shrink:0;
  cursor:pointer;
}
.drawer__settings-btn:hover{background:var(--surface-alt);color:var(--text-primary)}
.drawer__settings-btn svg{
  width:22px;height:22px;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

/* Divider */
.drawer__divider{
  height:1px;
  background:var(--border);
  margin:0 16px;
  flex-shrink:0;
}

/* Mode chips */
.drawer__modes{
  padding:14px 16px 10px;
  display:flex;
  gap:6px;
  flex-shrink:0;
}
.drawer__mode-chip{
  padding:7px 14px;
  border-radius:16px;
  background:rgba(255,255,255,.55);
  font-size:13px;font-weight:600;
  color:var(--text-secondary);
  cursor:pointer;
  transition:background 180ms cubic-bezier(.33,1,.68,1), color 180ms cubic-bezier(.33,1,.68,1);
}
.drawer__mode-chip.is-active{
  background:var(--bg);
  color:var(--text-primary);
  box-shadow:inset 0 0 0 1px var(--border);
}

/* New chat */
.drawer__new{
  display:flex;
  align-items:center;
  gap:12px;
  margin:2px 8px 12px;
  padding:12px 12px;
  border-radius:12px;
  font-size:15px;font-weight:600;
  color:var(--text-primary);
  transition:background var(--t-fast);
  flex-shrink:0;
}
.drawer__new:hover{background:var(--surface-alt)}
.drawer__new svg{
  width:22px;height:22px;
  fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
}

/* Sessions */
.drawer__sessions-wrap{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  border-top:1px solid var(--border);
  padding-top:6px;
  overflow:hidden;
}
.drawer__sessions-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 20px 10px;
  flex-shrink:0;
}
.drawer__sessions-title{
  font-size:15px;font-weight:700;
  color:var(--text-primary);
  letter-spacing:-.02em;
}
.drawer__filter{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;
  border-radius:var(--r-pill);
  border:1px solid var(--border);
  font-size:12px;font-weight:500;
  color:var(--text-secondary);
  transition:background var(--t-fast);
  cursor:pointer;
}
.drawer__filter:hover{background:var(--bg)}
.drawer__filter svg{
  width:10px;height:10px;
  fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
}

.drawer__empty-state{
  padding:16px 20px;
  text-align:center;
  font-size:13px;
  color:var(--text-secondary);
}
.drawer__empty-state[hidden]{display:none}

.drawer__history{
  flex:1;min-height:0;
  overflow-y:auto;
  padding:0 8px 88px;
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:0;
}
.drawer__history[hidden]{display:none}

.history-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  border-radius:10px;
  cursor:pointer;
  transition:background var(--t-fast);
  position:relative;
}
.history-row:hover{background:var(--bg)}
.history-row.is-active{background:rgba(24,119,242,.10)}
.history-row.is-active .history-row__title{color:var(--accent);font-weight:600}
.history-row__icon{
  width:20px;height:20px;flex-shrink:0;
  fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.history-row__title{
  flex:1;min-width:0;
  font-size:14.5px;font-weight:500;
  color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-.005em;
}
.history-row__del{
  display:none;
  width:26px;height:26px;
  align-items:center;justify-content:center;
  border-radius:6px;
  color:var(--text-secondary);
  flex-shrink:0;
  transition:background var(--t-fast),color var(--t-fast);
  cursor:pointer;
}
.history-row:hover .history-row__del{display:flex}
.history-row__del:hover{background:var(--danger-soft);color:var(--danger)}
.history-row__del svg{
  width:14px;height:14px;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

/* Drawer FAB */
.drawer__fab{
  position:absolute;
  bottom:18px;right:18px;
  width:52px;height:52px;
  border-radius:16px;
  background:var(--accent);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(24,119,242,.30);
  transition:transform var(--t-base), background var(--t-base);
  cursor:pointer;
}
.drawer__fab:hover{background:#166fe5;transform:translateY(-2px)}
.drawer__fab:active{transform:translateY(0) scale(.96)}
.drawer__fab svg{
  width:24px;height:24px;
  fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
}

/* =========================================================
   showSearchChats — bottom sheet modal
   ========================================================= */
.sheet-scrim{
  position:fixed;inset:0;
  background:rgba(0,0,0,.44);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  z-index:220;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;visibility:hidden;
  transition:opacity 220ms cubic-bezier(.4,0,.2,1),visibility 220ms cubic-bezier(.4,0,.2,1);
}
.sheet-scrim.is-open{opacity:1;visibility:visible}
.search-sheet{
  width:100%;
  max-width:600px;
  background:var(--bg);
  border-top-left-radius:20px;border-top-right-radius:20px;
  padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  max-height:82vh;
  transform:translateY(100%);
  transition:transform 340ms cubic-bezier(.16,1,.3,1);
  box-shadow:0 -8px 32px rgba(0,0,0,.18);
}
.sheet-scrim.is-open .search-sheet{transform:translateY(0)}
.sheet-grabber{
  width:44px;height:4px;
  background:var(--border);
  border-radius:2px;
  margin:0 auto 16px;
  flex-shrink:0;
}
.search-sheet__input{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  height:46px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  flex-shrink:0;
}
.search-sheet__input svg{
  width:20px;height:20px;flex-shrink:0;
  fill:none;stroke:var(--text-secondary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.search-sheet__input input{
  flex:1;min-width:0;height:100%;
  font-size:15px;color:var(--text-primary);
}
.search-sheet__input input::placeholder{color:var(--text-secondary)}
.search-sheet__results{
  flex:1;min-height:0;overflow-y:auto;
  margin-top:14px;
}
.search-sheet__empty{
  padding:32px 20px;
  text-align:center;
  font-size:14px;
  color:var(--text-secondary);
}
.search-sheet__empty[hidden]{display:none}
.search-sheet__item{
  display:flex;align-items:center;gap:12px;
  padding:12px 10px;
  border-radius:10px;
  cursor:pointer;
  width:100%;
  text-align:left;
  transition:background var(--t-fast);
}
.search-sheet__item:hover{background:var(--surface)}
.search-sheet__item svg{
  width:20px;height:20px;flex-shrink:0;
  fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.search-sheet__item-label{
  flex:1;min-width:0;
  font-size:14.5px;font-weight:500;
  color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* =========================================================
   GhostChatScreen
   ========================================================= */
.ghost-modal{
  position:fixed;inset:0;
  background:var(--bg);
  z-index:230;
  display:flex;flex-direction:column;
  animation:pageIn .28s cubic-bezier(.16,1,.3,1);
}
.ghost-modal[hidden]{display:none}
@keyframes pageIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.ghost__head{
  display:flex;align-items:center;gap:8px;
  padding:10px 8px;
  flex-shrink:0;
}
.ghost__back{
  width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  color:var(--text-primary);
  transition:background var(--t-fast);
  cursor:pointer;
}
.ghost__back:hover{background:var(--surface-alt)}
.ghost__back svg{
  width:22px;height:22px;
  fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}
.ghost__title-row{
  display:flex;align-items:center;gap:8px;
  flex:1;min-width:0;
}
.ghost__title-row svg{
  width:18px;height:18px;
  fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  color:var(--text-primary);
  flex-shrink:0;
}
.ghost__title{
  font-size:16px;font-weight:500;
  color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ghost__notice{
  display:flex;align-items:flex-start;gap:8px;
  margin:8px 16px 0;
  padding:10px 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  flex-shrink:0;
}
.ghost__notice svg{
  width:16px;height:16px;flex-shrink:0;margin-top:1px;
  fill:none;stroke:var(--text-secondary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.ghost__notice-text{
  font-size:12.5px;
  color:var(--text-secondary);
  line-height:1.4;
}
.ghost__scroll{
  flex:1;min-height:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  padding:12px 16px;
}
.ghost__empty{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  font-size:15px;
  color:var(--text-secondary);
  padding:0 24px;
  line-height:1.5;
}
.ghost__empty[hidden]{display:none}
.ghost__list{
  display:flex;flex-direction:column;gap:10px;
}
.ghost__msg{
  display:flex;
}
.ghost__msg--user{justify-content:flex-end}
.ghost__msg--assistant{justify-content:flex-start}
.ghost__bubble{
  max-width:78%;
  padding:12px 16px;
  border-radius:16px;
  font-size:15px;line-height:1.4;
  word-wrap:break-word;
  border:1px solid var(--border);
}
.ghost__msg--user .ghost__bubble{
  background:rgba(24,119,242,.18);
  color:var(--text-primary);
}
.ghost__msg--assistant .ghost__bubble{
  background:var(--surface);
  color:var(--text-primary);
}
.ghost__bubble p{margin:0 0 8px}
.ghost__bubble p:last-child{margin-bottom:0}
.ghost__form{
  flex-shrink:0;
  padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));
}
.ghost__input-wrap{
  display:flex;align-items:center;gap:6px;
  padding:6px 6px 6px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:28px;
}
.ghost__input{
  flex:1;min-width:0;height:38px;
  font-size:15px;
  color:var(--text-primary);
}
.ghost__input::placeholder{color:var(--text-secondary)}
.ghost__send{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  color:var(--accent);
  transition:background var(--t-fast);
  flex-shrink:0;
  cursor:pointer;
}
.ghost__send:hover{background:var(--surface-alt)}
.ghost__send:disabled{color:var(--text-secondary);cursor:not-allowed}
.ghost__send svg{
  width:22px;height:22px;
  fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}

/* =========================================================
   Toasts
   ========================================================= */
.toasts{
  position:fixed;
  bottom:calc(96px + env(safe-area-inset-bottom,0px));
  left:50%;
  transform:translateX(-50%);
  display:flex;flex-direction:column;
  gap:8px;
  z-index:9999;
  pointer-events:none;
  width:calc(100% - 32px);
  max-width:400px;
}
.toast{
  padding:12px 16px;
  background:#1a1a1c;color:#fff;
  border-radius:12px;
  font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.24);
  pointer-events:auto;
  animation:toastIn .3s cubic-bezier(.16,1,.3,1);
  cursor:pointer;
}
.toast--ok{background:#0f5132}
.toast--err{background:#842029}
.toast--info{background:#0c4a6e}
.toast--warn{background:#664d03}
@keyframes toastIn{
  from{transform:translateY(20px);opacity:0}
  to{transform:translateY(0);opacity:1}
}
.toast__icon{flex-shrink:0;font-weight:700;opacity:.9}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<!-- =========================================================
     AppDrawer
     ========================================================= -->
<div class="drawer-scrim" data-drawer-scrim></div>
<aside class="drawer" data-drawer>
  <div class="drawer__head">
    <div class="drawer__avatar" data-user-avatar>U</div>
    <div class="drawer__user-info">
      <div class="drawer__user-name" data-user-name>Usuario</div>
      <div class="drawer__user-email" data-user-email>—</div>
    </div>
    <button type="button" class="drawer__settings-btn" data-open-settings aria-label="Ajustes">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="drawer__modes">
    <button type="button" class="drawer__mode-chip is-active" data-mode="chat">Chat</button>
    <button type="button" class="drawer__mode-chip" data-mode="coder">Coder</button>
  </div>

  <button type="button" class="drawer__new" data-new-chat>
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Nuevo chat
  </button>

  <div class="drawer__divider"></div>

  <div class="drawer__sessions-wrap">
    <div class="drawer__sessions-head">
      <span class="drawer__sessions-title">Sesiones</span>
      <button type="button" class="drawer__filter" data-filter-btn>
        <span data-filter-label>Todo</span>
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    <div class="drawer__empty-state" data-history-empty>Sin chats todavía</div>
    <ul class="drawer__history" data-history hidden></ul>
  </div>

  <button type="button" class="drawer__fab" data-new-chat-fab title="Nuevo chat">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</aside>

<!-- =========================================================
     Main app — Scaffold body: SafeArea → Column
     ========================================================= -->
<div class="app">

  <!-- _TopBar -->
  <header class="topbar">
    <button type="button" class="topbar__menu-wrap" data-menu-btn aria-label="Menú">
      <svg viewBox="0 0 24 24">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="topbar__gap4"></div>
    <button type="button" class="topbar__search" data-search-btn>
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <line x1="20" y1="20" x2="16.65" y2="16.65"/>
      </svg>
      <span class="topbar__search-text">Buscar chats</span>
    </button>
    <div class="topbar__gap4"></div>
    <button type="button" class="topbar__ghost-wrap" data-ghost-btn aria-label="Chat incógnito">
      <svg viewBox="0 0 24 24">
        <path d="M9 10h.01M15 10h.01M12 2a8 8 0 0 0-8 8v4a6 6 0 0 0 6 6h4a6 6 0 0 0 6-6v-4a8 8 0 0 0-8-8Z"/>
      </svg>
    </button>
  </header>

  <!-- Expanded → scroll -->
  <div class="scroll" data-scroll>

<!-- Toasts -->
<div class="toasts" id="nm-toasts" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   Lógica de UI conectada al Backend
   ========================================================= */
(function () {
  'use strict';

  var $ = function (s, c) { return (c || document).querySelector(s); };
  var $$ = function (s, c) { return [].slice.call((c || document).querySelectorAll(s)); };

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = String(s == null ? '' : s);
    return d.innerHTML;
  }

  /* ─────────── Toast ─────────── */
  function toast(kind, msg) {
    var host = document.getElementById('nm-toasts');
    if (!host) return;
    var el = document.createElement('div');
    el.className = 'toast toast--' + kind;
    var ico = { ok: '✓', err: '✕', info: 'ⓘ', warn: '⚠' }[kind] || '';
    el.innerHTML = '<span class="toast__icon">' + ico + '</span><span>' + escapeHtml(msg) + '</span>';
    host.appendChild(el);
    var timer = setTimeout(function () {
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(16px)';
      setTimeout(function () { el.remove(); }, 320);
    }, 3400);
    el.addEventListener('click', function () { clearTimeout(timer); el.remove(); }, { once: true });
  }

  /* ─────────── Markdown ─────────── */
  function mdRender(text) {
    var h = escapeHtml(String(text || ''));
    h = h.replace(/```(\w+)?\n?([\s\S]*?)```/g, function (m, lang, code) {
      var l = lang || 'texto';
      var enc = encodeURIComponent(code.trim());
      return '<div class="md-pre-head"><span>' + l + '</span>' +
        '<button type="button" class="md-pre-copy" data-copy="' + enc + '">Copiar</button>' +
        '</div><pre><code>' + code.trim() + '</code></pre>';
    });
    h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    h = h.replace(/^### (.+)$/gm, '<h4>$1</h4>');
    h = h.replace(/^## (.+)$/gm, '<h3>$1</h3>');
    h = h.replace(/^# (.+)$/gm, '<h2>$1</h2>');
    h = h.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
    h = h.replace(/^[\-\*]\s+(.+)$/gm, '<li>$1</li>');
    h = h.replace(/(<li>[\s\S]*?<\/li>)(?=\s*<(?!li))/g, '<ul>$1</ul>');
    h = h.replace(/\n/g, '<br>');
    h = h.replace(/<br>(<(?:ul|ol|pre|blockquote|h[2-4]|li|div|hr))/g, '$1');
    h = h.replace(/(<\/(?:ul|ol|pre|blockquote|h[2-4]|li|div|hr)>)<br>/g, '$1');
    return h;
  }
  function mdEnhance(root) {
    root.querySelectorAll('.md-pre-copy').forEach(function (btn) {
      if (btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', function () {
        var code = decodeURIComponent(btn.dataset.copy || '');
        navigator.clipboard.writeText(code).then(function () {
          btn.textContent = 'Copiado';
          btn.classList.add('is-copied');
          setTimeout(function () { btn.textContent = 'Copiar'; btn.classList.remove('is-copied'); }, 1400);
        });
      });
    });
  }

  /* ─────────── State ─────────── */
  var state = {
    messages: [],
    isSending: false,
    isLoadingHistory: false,
    activeChatId: null,
    chats: [],
    mode: 'chat',
    webEnabled: false,
    imageEnabled: false,
    overthink: false,
    toolsExpanded: false,
    attachments: [],
    animatedAssistantId: null,
  };

  /* ─────────── DOM ─────────── */
  var els = {
    empty: $('[data-empty]'),
    messages: $('[data-messages]'),
    scroll: $('[data-scroll]'),
    promptStarters: $('[data-prompt-starters]'),
    composer: $('[data-composer]'),
    toolsHead: $('[data-tools-head]'),
    toolsHeadLabel: $('[data-tools-head-label]'),
    toolsHeadIcon: $('[data-tools-head-icon]'),
    toolsPanel: $('[data-tools-panel]'),
    plusBtn: $('[data-plus-btn]'),
    input: $('[data-input]'),
    send: $('[data-send]'),
    mic: $('[data-mic]'),
    attachments: $('[data-attachments]'),
    drawer: $('[data-drawer]'),
    drawerScrim: $('[data-drawer-scrim]'),
    historyList: $('[data-history]'),
    historyEmpty: $('[data-history-empty]'),
    menuBtn: $('[data-menu-btn]'),
    searchBtn: $('[data-search-btn]'),
    ghostBtn: $('[data-ghost-btn]'),
    searchScrim: $('[data-search-sheet-scrim]'),
    searchInput: $('[data-search-input]'),
    searchList: $('[data-search-list]'),
    searchEmpty: $('[data-search-empty]'),
    ghostModal: $('[data-ghost-modal]'),
    ghostBack: $('[data-ghost-back]'),
    ghostScroll: $('[data-ghost-scroll]'),
    ghostList: $('[data-ghost-list]'),
    ghostEmpty: $('[data-ghost-empty]'),
    ghostForm: $('[data-ghost-form]'),
    ghostInput: $('[data-ghost-input]'),
    ghostSend: $('[data-ghost-send]'),
  };

  /* ─────────── Composer helpers ─────────── */
  function updateComposer() {
    if (!els.input || !els.send) return;
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 130) + 'px';
    els.send.disabled = !els.input.value.trim() || state.isSending;
  }

  function updateComposerBorder() {
    if (!els.composer) return;
    var hasActiveTool = state.webEnabled || state.imageEnabled || state.overthink;
    var open = state.toolsExpanded || hasActiveTool;
    els.composer.classList.toggle('has-tools-open', open);
  }

  function updateToolsHead() {
    if (!els.toolsHead) return;
    var hasActiveTool = state.webEnabled || state.imageEnabled || state.overthink;
    if (state.toolsExpanded || hasActiveTool) {
      els.toolsHead.hidden = false;
      if (state.toolsExpanded) {
        els.toolsHeadLabel.hidden = false;
        els.toolsHeadLabel.textContent = 'HERRAMIENTAS';
        if (els.toolsHeadIcon) els.toolsHeadIcon.hidden = true;
      } else {
        els.toolsHeadLabel.hidden = true;
        if (els.toolsHeadIcon) {
          els.toolsHeadIcon.hidden = false;
          var iconSvg;
          if (state.webEnabled) {
            iconSvg = '<circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a13 13 0 0 1 4 9 13 13 0 0 1-4 9 13 13 0 0 1-4-9 13 13 0 0 1 4-9z"/>';
          } else if (state.imageEnabled) {
            iconSvg = '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>';
          } else {
            iconSvg = '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>';
          }
          els.toolsHeadIcon.innerHTML = '<svg viewBox="0 0 24 24">' + iconSvg + '</svg>';
        }
      }
    } else {
      els.toolsHead.hidden = true;
    }
  }

  function updateToolsPanel() {
    if (!els.toolsPanel) return;
    els.toolsPanel.hidden = !state.toolsExpanded;
  }

  function updatePlusButton() {
    if (!els.plusBtn) return;
    els.plusBtn.classList.toggle('is-open', state.toolsExpanded);
    els.plusBtn.title = state.toolsExpanded ? 'Cerrar herramientas' : 'Más herramientas';
  }

  function updateToolButtonStates() {
    $$('.tool-btn[data-tool="web"]').forEach(function (b) {
      b.classList.toggle('is-active', state.webEnabled);
    });
    $$('.tool-btn[data-tool="image"]').forEach(function (b) {
      b.classList.toggle('is-active', state.imageEnabled);
    });
    $$('.tool-btn[data-tool="deep"]').forEach(function (b) {
      b.classList.toggle('is-active', state.overthink);
    });
  }

  function renderAttachments() {
    if (!els.attachments) return;
    els.attachments.innerHTML = '';
    if (state.attachments.length === 0) return;
    state.attachments.forEach(function (f, idx) {
      var chip = document.createElement('div');
      chip.className = 'attachment-chip';
      chip.innerHTML =
        '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' +
        '<span class="attachment-chip__name">' + escapeHtml(f.name) + '</span>' +
        '<button type="button" class="attachment-chip__del" data-idx="' + idx + '" aria-label="Quitar">' +
          '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>';
      chip.querySelector('.attachment-chip__del').addEventListener('click', function (e) {
        e.stopPropagation();
        state.attachments.splice(idx, 1);
        renderAttachments();
      });
      els.attachments.appendChild(chip);
    });
  }

  /* ─────────── Messages render ─────────── */
  function renderAll() {
    if (!els.messages) return;
    if (state.messages.length === 0) {
      els.empty.hidden = false;
      els.messages.hidden = true;
      els.messages.innerHTML = '';
      if (els.promptStarters) els.promptStarters.hidden = false;
      return;
    }
    els.empty.hidden = true;
    els.messages.hidden = false;
    if (els.promptStarters) els.promptStarters.hidden = true;

    els.messages.innerHTML = '';
    state.messages.forEach(function (m) {
      els.messages.appendChild(renderBubble(m));
    });
    scrollToBottom();
  }

  function renderBubble(msg) {
    var isUser = msg.role === 'user';
    var wrap = document.createElement('div');
    wrap.className = 'message ' + (isUser ? 'message--user' : 'message--assistant');

    var col = document.createElement('div');
    col.className = 'message__col';

    if (!isUser && msg.memorySaved) {
      var mem = document.createElement('div');
      mem.className = 'memory-saved';
      mem.innerHTML =
        '<div class="memory-saved__icon">' +
          '<svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>' +
        '</div>' +
        '<div class="memory-saved__body">' +
          '<div class="memory-saved__title">Memoria guardada</div>' +
          '<div class="memory-saved__gap2"></div>' +
          '<div class="memory-saved__sub">' + escapeHtml(msg.memoryTitle || 'Recuerdo guardado') + '</div>' +
        '</div>';
      col.appendChild(mem);
    }

    if (msg.imageUrl) {
      var imgWrap = document.createElement('div');
      imgWrap.className = 'message__image-wrap';
      var img = document.createElement('img');
      img.src = msg.imageUrl;
      img.alt = '';
      img.loading = 'lazy';
      imgWrap.appendChild(img);
      col.appendChild(imgWrap);
      if (msg.text && msg.text.trim()) {
        var textPad = document.createElement('div');
        textPad.className = 'message__assistant-pad';
        textPad.innerHTML = mdRender(msg.text);
        mdEnhance(textPad);
        col.appendChild(textPad);
      }
    } else if (isUser) {
      var bubble = document.createElement('div');
      bubble.className = 'message__bubble-user';
      bubble.innerHTML = mdRender(msg.text || '');
      mdEnhance(bubble);
      col.appendChild(bubble);
    } else {
      var apad = document.createElement('div');
      apad.className = 'message__assistant-pad';
      apad.innerHTML = mdRender(msg.text || '');
      mdEnhance(apad);
      col.appendChild(apad);
    }

    var actions = document.createElement('div');
    actions.className = 'message__actions';

    if (isUser) {
      var editBtn = makeActionBtn('Editar mensaje',
        '<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>');
      editBtn.addEventListener('click', function () {
        if (!els.input) return;
        els.input.value = msg.text || '';
        els.input.focus();
        updateComposer();
      });
      actions.appendChild(editBtn);
    }

    var copyBtn = makeActionBtn('Copiar mensaje',
      '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>');
    copyBtn.addEventListener('click', function () {
      navigator.clipboard.writeText(msg.text || '').then(function () {
        toast('ok', 'Mensaje copiado');
      });
    });
    actions.appendChild(copyBtn);

    if (!isUser) {
      var upBtn = makeActionBtn('Me gustó esta respuesta',
        '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>');
      upBtn.addEventListener('click', function () { toast('ok', '¡Gracias por tu opinión!'); });
      actions.appendChild(upBtn);

      var downBtn = makeActionBtn('No me ayudó',
        '<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>');
      downBtn.addEventListener('click', function () { toast('ok', 'Opinión guardada'); });
      actions.appendChild(downBtn);
    }

    col.appendChild(actions);
    wrap.appendChild(col);
    return wrap;
  }

  function makeActionBtn(tip, svgBody) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'message__action';
    btn.dataset.tip = tip;
    btn.innerHTML = '<svg viewBox="0 0 24 24">' + svgBody + '</svg>';
    return btn;
  }

  function createThinking() {
    var el = document.createElement('div');
    el.className = 'thinking';
    el.innerHTML =
      '<div class="thinking__dot"></div>' +
      '<div class="thinking__dot"></div>' +
      '<div class="thinking__dot"></div>';
    return el;
  }

  function scrollToBottom() {
    if (!els.scroll) return;
    requestAnimationFrame(function () {
      els.scroll.scrollTop = els.scroll.scrollHeight;
    });
  }

  /* ─────────── Send message (Conectado al Backend) ─────────── */
  async function sendMessage(prompt) {
    if (!prompt || state.isSending) return;
    state.isSending = true;
    updateComposer();

    state.messages.push({ role: 'user', text: prompt });
    renderAll();

    els.empty.hidden = true;
    els.messages.hidden = false;
    if (els.promptStarters) els.promptStarters.hidden = true;

    var liveWrap = document.createElement('div');
    liveWrap.className = 'message message--assistant';
    liveWrap.innerHTML =
      '<div class="message__col">' +
        '<div class="message__assistant-pad" style="padding:6px 4px;">' +
          '<span class="stream-text"></span><span class="stream-cursor"></span>' +
        '</div>' +
      '</div>';
    els.messages.appendChild(liveWrap);

    var thinkEl = createThinking();
    els.messages.appendChild(thinkEl);
    scrollToBottom();

    var sEl = liveWrap.querySelector('.stream-text');
    var cEl = liveWrap.querySelector('.stream-cursor');
    var acc = '';
    var firstToken = false;

    try {
      var history = state.messages.slice(0, -1).slice(-12).map(function (m) {
        return { role: m.role === 'user' ? 'user' : 'assistant', content: m.text || '' };
      });

      // LLAMADA A TU BACKEND (src/index.js)
      var res = await fetch('/api/chat/stream', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: prompt,
          mode: state.mode,
          chatId: state.activeChatId || null,
          overthink: state.overthink,
          webSearch: state.webEnabled,
          history: history,
        }),
      });

      if (res.status === 401) { location.href = '/login'; return; }
      if (res.status === 429) {
        var err = await res.json();
        throw new Error(err.error || 'Límite alcanzado.');
      }
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = '';

      while (true) {
        var x = await reader.read();
        if (x.done) break;
        buf += dec.decode(x.value, { stream: true });
        var parts = buf.split('\n\n');
        buf = parts.pop() || '';
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          if (p.indexOf('data: ') !== 0) continue;
          try {
            var evt = JSON.parse(p.slice(6));
            if (evt.error) {
              acc += '\n\n⚠️ ' + evt.error;
            } else if (evt.token) {
              if (!firstToken) {
                firstToken = true;
                if (thinkEl && thinkEl.parentNode) thinkEl.remove();
              }
              acc += evt.token;
              sEl.textContent = acc;
              scrollToBottom();
            }
          } catch (e) {}
        }
      }
    } catch (err) {
      if (!acc.trim()) acc = '⚠️ No pude contactar al servidor. Intenta de nuevo.';
      else acc += '\n\n⚠️ ' + (err.message || 'Error');
      toast('err', err.message || 'Error de conexión');
    } finally {
      if (thinkEl && thinkEl.parentNode) thinkEl.remove();
      if (cEl && cEl.parentNode) cEl.remove();

      var imageMatch = acc.match(/\n\[\[IMAGE\]\](https?:\/\/\S+)/);
      var imageUrl = null;
      var textContent = acc;
      if (imageMatch) {
        imageUrl = imageMatch[1];
        textContent = acc.replace(/\n\[\[IMAGE\]\][^\s]+/, '').trim();
      }

      state.messages.push({
        role: 'assistant',
        text: textContent || (imageUrl ? 'Imagen generada.' : 'Sin respuesta.'),
        imageUrl: imageUrl,
      });

      renderAll();
      state.isSending = false;
      updateComposer();
      scrollToBottom();
    }
  }

  function doSend() {
    if (!els.input) return;
    var text = els.input.value.trim();
    if (!text || state.isSending) return;
    els.input.value = '';
    updateComposer();
    state.activeChatId = null;
    sendMessage(text);
  }

  /* ─────────── Composer setup ─────────── */
  function setupComposer() {
    if (!els.input || !els.send) return;

    els.input.addEventListener('input', updateComposer);
    els.input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        doSend();
      }
    });
    els.send.addEventListener('click', doSend);

    if (els.plusBtn) {
      els.plusBtn.addEventListener('click', function () {
        state.toolsExpanded = !state.toolsExpanded;
        updatePlusButton();
        updateToolsPanel();
        updateToolsHead();
        updateComposerBorder();
      });
    }

    $$('.tool-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var t = btn.dataset.tool;
        if (t === 'web') {
          state.webEnabled = !state.webEnabled;
          state.toolsExpanded = false;
        } else if (t === 'image') {
          state.imageEnabled = !state.imageEnabled;
          state.toolsExpanded = false;
        } else if (t === 'deep') {
          state.overthink = !state.overthink;
          state.toolsExpanded = false;
        } else if (t === 'attach') {
          state.toolsExpanded = false;
          toast('info', 'Adjuntar archivos próximamente');
        }
        updateToolButtonStates();
        updatePlusButton();
        updateToolsPanel();
        updateToolsHead();
        updateComposerBorder();
      });
    });

    $$('[data-mode]').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var m = chip.dataset.mode;
        if (m === 'coder') { location.href = '/coder'; return; }
        state.mode = m;
        $$('[data-mode]').forEach(function (c) {
          c.classList.toggle('is-active', c.dataset.mode === state.mode);
        });
      });
    });

    if (els.mic) {
      els.mic.addEventListener('click', function () {
        toast('info', 'Dictado próximamente');
      });
    }

    if (els.promptStarters) {
      els.promptStarters.querySelectorAll('[data-prompt]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!els.input) return;
          els.input.value = btn.dataset.prompt || '';
          els.input.focus();
          updateComposer();
        });
      });
    }
  }

  /* ─────────── Drawer ─────────── */
  function openDrawer() {
    if (els.drawer) els.drawer.classList.add('is-open');
    if (els.drawerScrim) els.drawerScrim.classList.add('is-open');
  }
  function closeDrawer() {
    if (els.drawer) els.drawer.classList.remove('is-open');
    if (els.drawerScrim) els.drawerScrim.classList.remove('is-open');
  }

  function renderHistory() {
    if (!els.historyList) return;
    els.historyList.innerHTML = '';
    var visible = state.chats;
    if (visible.length === 0) {
      if (els.historyEmpty) els.historyEmpty.hidden = false;
      els.historyList.hidden = true;
      return;
    }
    if (els.historyEmpty) els.historyEmpty.hidden = true;
    els.historyList.hidden = false;
    visible.forEach(function (c) {
      var li = document.createElement('li');
      li.className = 'history-row' + (c.id === state.activeChatId ? ' is-active' : '');
      li.innerHTML =
        '<svg class="history-row__icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
        '<span class="history-row__title">' + escapeHtml(c.title) + '</span>' +
        '<button type="button" class="history-row__del" aria-label="Eliminar">' +
          '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>' +
        '</button>';
      li.addEventListener('click', function (e) {
        if (e.target.closest('.history-row__del')) return;
        state.activeChatId = c.id;
        closeDrawer();
        toast('info', 'Cargando: ' + c.title);
      });
      li.querySelector('.history-row__del').addEventListener('click', function (e) {
        e.stopPropagation();
        state.chats = state.chats.filter(function (x) { return x.id !== c.id; });
        renderHistory();
        toast('ok', 'Chat eliminado');
      });
      els.historyList.appendChild(li);
    });
  }

  function setupDrawer() {
    if (els.menuBtn) els.menuBtn.addEventListener('click', openDrawer);
    if (els.drawerScrim) els.drawerScrim.addEventListener('click', closeDrawer);

    $$('[data-new-chat], [data-new-chat-fab]').forEach(function (b) {
      b.addEventListener('click', function () {
        state.messages = [];
        state.activeChatId = null;
        renderAll();
        closeDrawer();
        if (els.input) { els.input.value = ''; updateComposer(); els.input.focus(); }
      });
    });

    $$('.drawer__mode-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var m = chip.dataset.mode;
        if (m === 'coder') { location.href = '/coder'; return; }
        $$('.drawer__mode-chip').forEach(function (c) {
          c.classList.toggle('is-active', c.dataset.mode === m);
        });
      });
    });

    var filterBtn = $('[data-filter-btn]');
    if (filterBtn) {
      filterBtn.addEventListener('click', function () {
        var label = $('[data-filter-label]');
        if (!label) return;
        label.textContent = label.textContent === 'Todo' ? 'Chat' : 'Todo';
      });
    }

    var settingsBtn = $('[data-open-settings]');
    if (settingsBtn) settingsBtn.addEventListener('click', function () {
      location.href = '/settings';
    });

    renderHistory();
  }

  /* ─────────── Search sheet ─────────── */
  function openSearch() {
    if (!els.searchScrim) return;
    els.searchScrim.classList.add('is-open');
    setTimeout(function () {
      if (els.searchInput) els.searchInput.focus();
    }, 220);
    renderSearchResults('');
  }
  function closeSearch() {
    if (!els.searchScrim) return;
    els.searchScrim.classList.remove('is-open');
    if (els.searchInput) els.searchInput.value = '';
  }
  function renderSearchResults(q) {
    if (!els.searchList) return;
    q = (q || '').toLowerCase().trim();
    var list = state.chats.filter(function (c) {
      return !q || (c.title || '').toLowerCase().indexOf(q) !== -1;
    });
    els.searchList.innerHTML = '';
    if (list.length === 0) {
      if (els.searchEmpty) els.searchEmpty.hidden = false;
      return;
    }
    if (els.searchEmpty) els.searchEmpty.hidden = true;
    list.forEach(function (c) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'search-sheet__item';
      btn.innerHTML =
        '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
        '<span class="search-sheet__item-label">' + escapeHtml(c.title) + '</span>';
      btn.addEventListener('click', function () {
        closeSearch();
        state.activeChatId = c.id;
        toast('info', 'Cargando: ' + c.title);
      });
      els.searchList.appendChild(btn);
    });
  }
  function setupSearch() {
    if (els.searchBtn) els.searchBtn.addEventListener('click', openSearch);
    if (els.searchScrim) {
      els.searchScrim.addEventListener('click', function (e) {
        if (e.target === els.searchScrim) closeSearch();
      });
    }
    if (els.searchInput) {
      els.searchInput.addEventListener('input', function () {
        renderSearchResults(els.searchInput.value);
      });
    }
  }

  /* ─────────── Ghost chat ─────────── */
  var ghost = { messages: [], sending: false };
  function openGhost() {
    if (!els.ghostModal) return;
    els.ghostModal.hidden = false;
    setTimeout(function () {
      if (els.ghostInput) els.ghostInput.focus();
    }, 200);
  }
  function closeGhost() {
    if (!els.ghostModal) return;
    els.ghostModal.hidden = true;
    ghost.messages = [];
    if (els.ghostList) els.ghostList.innerHTML = '';
    if (els.ghostEmpty) els.ghostEmpty.hidden = false;
    if (els.ghostInput) els.ghostInput.value = '';
    if (els.ghostSend) els.ghostSend.disabled = true;
  }
  function renderGhostMsg(msg) {
    var el = document.createElement('div');
    el.className = 'ghost__msg ghost__msg--' + msg.role;
    var b = document.createElement('div');
    b.className = 'ghost__bubble';
    b.innerHTML = mdRender(msg.content);
    mdEnhance(b);
    el.appendChild(b);
    return el;
  }
  async function sendGhost(text) {
    if (!text || ghost.sending) return;
    ghost.sending = true;
    if (els.ghostSend) els.ghostSend.disabled = true;

    ghost.messages.push({ role: 'user', content: text });
    if (els.ghostEmpty) els.ghostEmpty.hidden = true;
    if (els.ghostList) {
      els.ghostList.appendChild(renderGhostMsg({ role: 'user', content: text }));
      if (els.ghostScroll) els.ghostScroll.scrollTop = els.ghostScroll.scrollHeight;
    }

    var live = document.createElement('div');
    live.className = 'ghost__msg ghost__msg--assistant';
    live.innerHTML = '<div class="ghost__bubble"><span class="stream-text"></span><span class="stream-cursor"></span></div>';
    if (els.ghostList) els.ghostList.appendChild(live);
    var sEl = live.querySelector('.stream-text');
    var cEl = live.querySelector('.stream-cursor');
    var acc = '';

    try {
      var res = await fetch('/api/ai/chat', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text, mode: 'chat' }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      acc = (data && data.response) || 'Sin respuesta.';
      sEl.innerHTML = mdRender(acc);
      mdEnhance(live);
    } catch (err) {
      acc = 'No se pudo contactar al servidor. Intenta de nuevo.';
      sEl.innerHTML = mdRender(acc);
    } finally {
      if (cEl && cEl.parentNode) cEl.remove();
      ghost.messages.push({ role: 'assistant', content: acc });
      ghost.sending = false;
      if (els.ghostSend) els.ghostSend.disabled = !els.ghostInput || !els.ghostInput.value.trim();
      if (els.ghostScroll) els.ghostScroll.scrollTop = els.ghostScroll.scrollHeight;
    }
  }
  function setupGhost() {
    if (els.ghostBtn) els.ghostBtn.addEventListener('click', openGhost);
    if (els.ghostBack) els.ghostBack.addEventListener('click', closeGhost);
    if (els.ghostInput) {
      els.ghostInput.addEventListener('input', function () {
        if (els.ghostSend) els.ghostSend.disabled = !els.ghostInput.value.trim() || ghost.sending;
      });
      els.ghostInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (!els.ghostSend || els.ghostSend.disabled) return;
          var t = els.ghostInput.value.trim();
          els.ghostInput.value = '';
          sendGhost(t);
        }
      });
    }
    if (els.ghostForm) {
      els.ghostForm.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!els.ghostInput) return;
        var t = els.ghostInput.value.trim();
        if (!t) return;
        els.ghostInput.value = '';
        sendGhost(t);
      });
    }
  }

  /* ─────────── User info in drawer (src/auth.js) ─────────── */
  async function loadUser() {
    try {
      var res = await fetch('/api/auth/session', { credentials: 'include' });
      if (!res.ok) return;
      var data = await res.json();
      if (data && data.authenticated && data.user) {
        var u = data.user;
        var name = u.name || u.email || 'Usuario';
        var initial = (name[0] || 'U').toUpperCase();
        var nameEl = $('[data-user-name]');
        var emailEl = $('[data-user-email]');
        var avatarEl = $('[data-user-avatar]');
        if (nameEl) nameEl.textContent = name;
        if (emailEl) emailEl.textContent = u.email || '—';
        if (avatarEl) {
          if (u.picture) avatarEl.innerHTML = '<img src="' + escapeHtml(u.picture) + '" alt="" />';
          else avatarEl.textContent = initial;
        }
      }
    } catch (e) {}
  }

  /* ─────────── Theme ─────────── */
  function applyTheme() {
    try {
      var cur = localStorage.getItem('numination-theme') || 'blanco';
      document.documentElement.dataset.theme = cur;
    } catch (e) {}
  }

  /* ─────────── Boot ─────────── */
  function boot() {
    applyTheme();
    updateComposer();
    updateToolsPanel();
    updateToolsHead();
    updateComposerBorder();
    updateToolButtonStates();
    updatePlusButton();
    renderAttachments();
    renderAll();
    setupComposer();
    setupDrawer();
    setupSearch();
    setupGhost();
    loadUser();

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (els.ghostModal && !els.ghostModal.hidden) { closeGhost(); return; }
      if (els.searchScrim && els.searchScrim.classList.contains('is-open')) { closeSearch(); return; }
      if (els.drawer && els.drawer.classList.contains('is-open')) { closeDrawer(); return; }
    });

    console.log('%cNumination · chat.html (faithful port of home_screen.dart)',
      'color:#1877f2;font-weight:700;padding:3px 10px;background:#e7f3ff;border-radius:6px');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
</script>
