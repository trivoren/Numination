<!DOCTYPE html>
<html lang="es-CO" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Numination — Chat con la IA colombiana</title>
  <meta name="description" content="Habla con Numination, la primera IA educativa colombiana." />
  <meta name="theme-color" content="#003893" />
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/chat.css" />
</head>
<body class="chat-body" data-chat-shell>

<div class="chat-app">

  <aside class="sidebar" data-chat-sidebar>
    <header class="sidebar__header">
      <a href="index.html" class="sidebar__brand">
        <span class="sidebar__logo">
          <img src="assets/img/logo-n.png" alt="Numination" />
        </span>
        <span>Numination</span>
      </a>
      <button type="button" class="sidebar__close" data-chat-sidebar-close aria-label="Cerrar menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>

    <button type="button" class="new-chat" data-chat-new>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Nuevo chat</span>
    </button>

    <nav class="sidebar__nav">
      <a href="index.html" class="sidebar__nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Inicio</span>
      </a>
      <a href="nosotros.html" class="sidebar__nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Nosotros</span>
      </a>
      <a href="precio.html" class="sidebar__nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>Precios</span>
      </a>
      <a href="contacto.html" class="sidebar__nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <span>Contacto</span>
      </a>
    </nav>

    <div class="sidebar__section">
      <p class="sidebar__label">Conversaciones</p>
      <p class="sidebar__empty" data-chat-history-empty>Aún no hay conversaciones.</p>
      <ul class="sidebar__history" data-chat-history></ul>
    </div>

    <div class="sidebar__footer">
      <button type="button" class="sidebar__user" data-theme-toggle>
        <span class="sidebar__avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </span>
        <span class="sidebar__user-info">
          <span class="sidebar__user-name">Cambiar tema</span>
          <span class="sidebar__user-plan">Claro / Oscuro</span>
        </span>
      </button>
    </div>
  </aside>

  <div class="sidebar-overlay" data-chat-sidebar-overlay></div>

  <main class="main">

    <header class="topbar">
      <button type="button" class="topbar__menu" data-chat-sidebar-open aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <span class="topbar__title">Numination</span>
      <button type="button" class="topbar__new" data-chat-new aria-label="Nuevo chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </header>

    <div class="scroll" data-chat-messages>
      <div class="welcome" data-chat-empty>
        <div class="welcome__star">
          <img src="assets/img/logo-n.png" alt="Numination" />
        </div>
        <h1 class="welcome__title">¿En qué te ayudo hoy?</h1>

        <div class="suggestions">
          <button type="button" class="suggestion" data-suggestion="Explícame cómo resolver una ecuación cuadrática por factorización, con ejemplo paso a paso">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>
            <span>Resolver una ecuación cuadrática paso a paso</span>
          </button>

          <button type="button" class="suggestion" data-suggestion="Hazme un plan de estudio de 30 días para preparar el Saber 11">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Plan de estudio de 30 días para el Saber 11</span>
          </button>

          <button type="button" class="suggestion" data-suggestion="Dame 5 preguntas de lectura crítica tipo ICFES con su explicación">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>Preguntas de lectura crítica tipo ICFES</span>
          </button>

          <button type="button" class="suggestion" data-suggestion="Explícame la independencia de Colombia como una historia de aventuras">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2 4 7v6c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V7l-8-5z"/></svg>
            <span>La independencia de Colombia como una historia</span>
          </button>
        </div>

        <p class="welcome__note">
          Tus conversaciones viven solo en esta pestaña. Al cerrarla, se borran.
        </p>
      </div>

      <div class="thread" data-chat-thread aria-live="polite"></div>
    </div>

    <div class="composer">
      <div class="attach-preview" hidden data-attach-preview>
        <span class="attach-preview__icon">📎</span>
        <span class="attach-preview__name" data-attach-name></span>
        <span class="attach-preview__size" data-attach-size></span>
        <button type="button" class="attach-preview__remove" data-attach-remove aria-label="Quitar archivo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form class="composer__box" data-chat-form>
        <textarea class="composer__field" data-chat-field rows="1" maxlength="4000" placeholder="Pregúntale algo a Numination…" aria-label="Mensaje"></textarea>
        <div class="composer__row">
          <div class="composer__left">
            <button type="button" class="composer__icon-btn" data-attach-btn aria-label="Adjuntar archivo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <button type="button" class="composer__icon-btn" id="mic-btn" aria-label="Dictar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            </button>
          </div>
          <div class="composer__right">
            <button type="submit" class="composer__send" data-chat-send disabled aria-label="Enviar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
          </div>
        </div>
      </form>

      <p class="composer__hint">
        Numination puede cometer errores. Verifica la información importante.
      </p>
    </div>

  </main>

</div>

<script src="assets/js/chat.js"></script>
<script type="module" src="assets/js/main.js"></script>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
